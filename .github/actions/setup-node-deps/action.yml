name: Set up Node and dependencies
description: >
  Node pinned from .nvmrc plus a shared lockfile-keyed node_modules cache, so
  npm ci runs only when dependencies actually change. Every CI job uses the same
  cache key, so the first job to run on a new lockfile pays the install and the
  rest restore it. Run actions/checkout before this.

runs:
  using: composite
  steps:
    # NO `cache: npm` HERE, deliberately. setup-node's npm cache keys on the
    # SAME package-lock.json hash as the node_modules cache below it, so the two
    # can only ever hit or miss together - and on a hit, `npm ci` is skipped
    # entirely and the npm download cache is never read. It could only help in
    # the one case where it is guaranteed to have missed too.
    #
    # It was not free. MEASURED 2026-07-30 via `gh api
    # repos/Kangentic/mobile/actions/cache/usage`: the repository held 9.86 GB
    # of a 10 GB cap across 39 entries, and a second read minutes later showed
    # 9.25 GB across 37 - eviction happening live. The npm entries were
    # ~192 MB each across ~10 refs, so roughly 1.9 GB, or 19% of the cap, spent
    # on a cache that cannot be read.
    #
    # That matters because actions/cache evicts by LAST ACCESS across the whole
    # repository, so this was competing for budget with the Gradle User Home
    # entry that `Build (APK)` depends on - and cache health is worth minutes
    # there: two runs of IDENTICAL configuration on the same commit measured
    # 5m 38s apart on task reuse alone (30514455368 at 146 of 1029 cached,
    # 30517929707 at 391).
    #
    # No claim that removing this cache produced any particular speedup. The
    # argument is capacity, not a stopwatch: ~1.9 GB of a 10 GB cap, spent on
    # entries that cannot be read.
    #
    # The cost of removing it: on a genuine lockfile change, the ONE job that
    # wins the race to install pays a registry download instead of a local
    # unpack. Every other job still restores node_modules. Reversible in a line.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc

    # NO `restore-keys` on this one, also deliberately. A partial-key restore
    # would hand a job a node_modules built from a DIFFERENT lockfile, which is
    # exactly the drift scripts/checkInstallDrift.mjs exists to catch and which
    # presents as a wall of "has no exported member" errors in untouched files.
    # An exact-match-or-install cache is the correct shape here.
    - name: Cache node_modules
      id: cache-node-modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies (npm ci)
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
