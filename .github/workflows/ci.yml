name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI architecture, following the pattern in Kangentic/kangentic's ci.yml:
#
# - Standalone checks (lint, typecheck, native config) are one top-level job
#   each, always visible in the checks list.
# - The two test tiers are sharded matrices, each behind a thin gate job whose
#   `name:` is the required status check. The shards are an implementation
#   detail; the gate is what branch protection requires, so shard counts can be
#   retuned without touching protection.
# - A job `name:` IS the branch-protection context. Renaming one renames the
#   required check, so main's protection must be updated in the same change or
#   every PR blocks on a check that will never report.
# - node_modules is cached under one shared lockfile-keyed key
#   (.github/actions/setup-node-deps), so npm ci runs only when dependencies
#   change. The install was a larger share of each tier than the tier itself.
#
# Concurrency budget (GitHub Free caps concurrent jobs around 20): the shard
# phase is lint 1 + typecheck 1 + native-config 1 + unit 3 + components 4 = 10,
# plus the CLA workflow = 11. The thin gates run after their shards via `needs`,
# so they do not consume a shard-phase slot. That leaves real headroom for the
# E2E tier in e2e.yml.
#
# Shard counts are a first cut sized to file count (46 unit, 41 component) and
# should be retuned against observed CI timings, not guessed at again. Jest with
# React Native Testing Library is expected to be the long pole.
#
# The E2E tier lives in e2e.yml: it needs an Android emulator and a real APK, so
# it has a different shape and a much longer runtime.

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-deps
      - name: Lint (ESLint)
        run: npm run lint

  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-deps
      - name: Type check (tsc)
        run: npm run typecheck

  unit-shards:
    name: Unit Test (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-deps
      - name: Unit tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx vitest run tests/unit --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

  # Thin required gate: this single check is what branch protection requires, so
  # the shards stay an implementation detail. No checkout or install, so it adds
  # only job spin-up. Per-shard detail is in each shard's own log.
  unit:
    name: Unit tests (Vitest)
    needs: [unit-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on shard results
        run: |
          if [ "${{ needs.unit-shards.result }}" != "success" ]; then
            echo "One or more unit shards did not succeed (result: ${{ needs.unit-shards.result }})"
            exit 1
          fi
          echo "All unit shards passed."

  component-shards:
    name: Component Test (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-deps
      - name: Component tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx jest tests/components --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

  components:
    name: Component tests (Jest)
    needs: [component-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on shard results
        run: |
          if [ "${{ needs.component-shards.result }}" != "success" ]; then
            echo "One or more component shards did not succeed (result: ${{ needs.component-shards.result }})"
            exit 1
          fi
          echo "All component shards passed."

  # Closes the "planned" prebuild gate named in .claude/rules/expo-cng.md.
  # Prebuild takes about 4 seconds, so catching a broken config plugin here
  # rather than partway into a native build is nearly free.
  native-config:
    name: Native config (expo prebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-deps
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
      - name: Confirm the generated project is not committed
        # CNG: android/ must exist only as a build artifact. If prebuild output
        # ever shows up as tracked changes, someone committed the native tree.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- android ios)" ]; then
            echo "::error::prebuild produced tracked changes under android/ or ios/. Those directories must stay gitignored (see .claude/rules/expo-cng.md)."
            git status --porcelain -- android ios
            exit 1
          fi
          echo "Native project generated cleanly and stayed untracked."
