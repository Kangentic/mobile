name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, never a run on main. Same reasoning as e2e.yml's:
  # a cache is only shared with every branch once it has been written from the
  # DEFAULT branch, so the push-to-main run is what fills the node_modules cache
  # that .github/actions/setup-node-deps restores. Cancelling it mid-flight
  # leaves the next PR to run a cold `npm ci` in all six parallel jobs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI architecture, following the pattern in Kangentic/kangentic's ci.yml:
#
# - Standalone checks (lint, typecheck, native config) are one top-level job
#   each, always visible in the checks list.
# - The two test tiers are sharded matrices, each behind a thin gate job whose
#   `name:` is the required status check. The shards are an implementation
#   detail; the gate is what branch protection requires, so shard counts can be
#   retuned without touching protection.
# - A job `name:` IS the branch-protection context. Renaming one renames the
#   required check, so main's protection must be updated in the same change or
#   every PR blocks on a check that will never report.
#
# NAMING. Every job is `<Subject> (<qualifier>)`, and the qualifier is written
# the way the thing it names is normally written:
#
#   a TOOL keeps its own casing   `Lint (ESLint)`, `Type check (tsc)`,
#                                 `Unit Tests (Vitest)`, `Native config (prebuild)`,
#                                 `E2E Tests (Maestro)`
#   a SHARD is `n/m`              `Component Tests (1/2)`
#   anything else is prose        `Release counters (stores)`,
#                                 `E2E Tests (Smoke)`, `E2E Tests (Paired)`
#
# `tsc` is lowercase because that is the binary's name, not because it is a
# lesser kind of job. A slug is never a qualifier: `E2E Tests (smoke)` was the
# matrix key leaking into the checks list, and it read as a typo sitting beside
# the capitalised gate it belongs to.
#
# AND IT HAS TO FIT ON ONE LINE. The Actions sidebar is a narrow column, so a
# name that wraps is the row your eye skips. Check a candidate against that
# sidebar, never against a wide editor. Two names were retired on these grounds:
#
#   `Native config (CNG)`                 CNG is Continuous Native Generation, a
#                                         methodology rather than a tool. Every
#                                         other qualifier names something you
#                                         could go run, so this one taught the
#                                         reader that the parentheses mean
#                                         nothing. `prebuild` is what the job
#                                         actually runs, four times over.
#   `Release counters (store preflight)`  33 characters, and the only row in the
#                                         sidebar that wrapped onto two lines.
#                                         `(stores)` keeps the half that carried
#                                         information, which is what the counters
#                                         are checked against, and drops the half
#                                         the subject already implies.
#
# Both land at 24 to 25 characters, in line with `Component Tests (Jest)` at 22.
#
# WHAT THE NAME DOES NOT ENCODE: whether a row is a worker or the gate that
# aggregates it. That was tried, as the desktop repo's case trick (`Unit Test
# (1/3)` against `Unit tests (Vitest)`) and then as lowercase suite names here,
# and both spend a casing distinction on saying something GitHub's own
# "Required" badge already says, in a column too narrow for one capital letter
# to survive a skim. `1/2` is self-evidently a piece of something; the badge
# says the rest. Same argument e2e.yml uses for not writing "advisory" into the
# paired job's name.
#
# The cost is that desktop's list reads slightly differently. Accepted
# deliberately, in favour of legibility here.
#
# - node_modules is cached under one shared lockfile-keyed key
#   (.github/actions/setup-node-deps), so npm ci runs only when dependencies
#   change. The install was a larger share of each tier than the tier itself.
#
# Concurrency budget (GitHub Free caps concurrent jobs around 20): the parallel
# phase is lint 1 + typecheck 1 + native-config 1 + unit 1 + components 2 = 6,
# plus release-counters 1 on pull_request only = 7, plus the CLA workflow and
# e2e.yml's `changes` classifier = 9. `changes`, NOT e2e.yml's build job: the
# build `needs: changes`, so it cannot be running while this phase is, and the
# emulator jobs need the build in turn. The component gate runs after its shards
# via `needs`, so it does not consume a slot either. Queueing was observed at 12
# concurrent jobs, so the practical cap is lower than the documented one.
#
# That headroom was thin at 12 and is comfortable again at 9, because the shard
# cut below removed four jobs at the same time release-counters added one. Adding
# another always-on job should still come with a measurement rather than a guess.
#
# Shard counts are sized against MEASURED timings, not file counts.
#
# MEASURED 2026-07-28 (runs 30330724138, 30331755550, 30374734572; node_modules
# cache warm, 66 unit files / 43 component files). Re-measure with:
#   gh api repos/Kangentic/mobile/actions/runs/<run-id>/jobs \
#     --jq '.jobs[] | [.name, .started_at, .completed_at] | @tsv'
#
#   unit, when it was 2 shards    16-25s each
#   component, when it was 4      43-71s each   (each runs BOTH platforms)
#   lint                          25-36s
#   typecheck                     19-28s
#   native-config                 25-35s
#   whole gate                    73-90s wall clock
#
# SHARD COUNTS WERE CUT on those numbers, from unit 2 and components 4 to unit
# UNSHARDED and components 2. Both tiers were far under the re-shard threshold
# below, so the extra runners were buying wall-clock nothing while costing four
# rows in a checks list that had grown to 17.
#
# MEASURED AFTER the cut (run 30375728595), and it cost less than predicted:
#
#   unit, unsharded    30s        (was 2 shards at 16-25s, plus a 3s gate)
#   component shards   52s, 63s   (was 4 shards at 43-71s)
#   whole gate         ~80s       (was 73-90s)
#
# So halving the component shards did NOT double their runtime, because ~25s of
# each job is checkout plus cache restore before a single test runs. Sharding
# only ever divided the part of the job that was already the smaller half. Worth
# knowing before anyone reaches for more shards to make this faster.
#
# Two things follow, and the second is the one that matters as the suite grows.
#
# First, these tiers sit close to the job spin-up and cache-restore floor
# (~10-15s), so shards buy little until a tier is genuinely slow. Components keep
# a split because they are the slower tier (jest.config.js runs every component
# test on BOTH platforms, which roughly doubles its count).
#
# Second, the RE-SHARD RULE, so this does not need re-deriving. Add a shard to a
# tier when its slowest shard passes ~3 minutes, and only then. Below that the
# gate is dominated by e2e.yml and a faster tier changes nothing a human notices;
# above it the tier starts to matter and the spin-up floor is amortised. Mind the
# concurrency budget above when you do: the parallel phase is currently 6 jobs
# against an observed practical cap near 12.
#
# Deliberately NOT enforced by a tight `timeout-minutes`. A timeout that fires on
# healthy growth turns a "should re-shard someday" into a broken gate, which is
# the opposite of stable. The timeouts below are hang guards, sized generously on
# purpose.
#
# The E2E tier lives in e2e.yml: it needs an Android emulator and a real APK, so
# it has a different shape and a much longer runtime.

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      - name: Lint (ESLint)
        run: npm run lint
      # syncBranding.mjs's outputs (assets/brand/*, src/brand/*.generated.ts)
      # previously had no automated check anywhere, despite the script's own
      # header once claiming this ran inside /pull-request. This is that check.
      - name: Brand assets in sync
        run: npm run sync:branding:check

  typecheck:
    name: Type check (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      - name: Type check (tsc)
        run: npm run typecheck

  # UNSHARDED, and therefore no thin gate either: this one job both runs the
  # tier and is the required status check.
  #
  # It was 2 shards at 16-24s each, which is well under the re-shard threshold
  # below, so the split was buying nothing but two extra rows in the checks list.
  # Collapsing it also removes the ugliest name in the list, since a single
  # shard would have rendered as `Unit Tests (1/1)`.
  #
  # Re-sharding later does NOT touch branch protection, because the required
  # context is this name: rename this job to `Unit Tests (n/m)`, give it a
  # matrix, and add a thin gate that keeps the name `Unit Tests (Vitest)`, the
  # same shape the component tier has below.
  unit:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      - name: Unit Tests (Vitest)
        run: npx vitest run tests/unit

  component-shards:
    name: Component Tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      - name: Component Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: npx jest tests/components --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

  components:
    name: Component Tests (Jest)
    needs: [component-shards]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on shard results
        run: |
          if [ "${{ needs.component-shards.result }}" != "success" ]; then
            echo "One or more component shards did not succeed (result: ${{ needs.component-shards.result }})"
            exit 1
          fi
          echo "All component shards passed."

  # Closes the "planned" prebuild gate named in .claude/rules/expo-cng.md.
  # Prebuild takes about 4 seconds, so catching a broken config plugin here
  # rather than partway into a native build is nearly free.
  native-config:
    name: Native config (prebuild)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps
      # Closes the other half of the gate pre-registered in
      # .claude/rules/expo-cng.md. This was deliberately left out once, on the
      # grounds that it would redden an otherwise-green check over cosmetic drift.
      # That reasoning was wrong and cost real time: the drift it would have caught
      # included `expo` itself being three patches behind, and it was masking a
      # config-plugin import that failed under `eas build` while every gate passed.
      # Drift is not cosmetic when the SDK is one of the drifting packages.
      - name: Check for dependency drift
        run: npx expo install --check

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # iOS too, and this is not symmetry for its own sake. Prebuilding only
      # Android is what let a broken config-plugin import reach an iOS build: the
      # plugin evaluated fine for Android and this gate went green on every PR
      # while iOS could not even read the app config. Prebuild runs on Linux for
      # either platform (it is file generation; CocoaPods and Xcode are not
      # involved), so covering iOS costs a few seconds and closes that hole.
      #
      # Note this is weaker than it looks: `expo prebuild` resolves plugin imports
      # through Expo CLI's own loader, which is more forgiving than the strict Node
      # ESM resolution `eas build` uses. It catches a plugin that throws; it does
      # not catch every import that only fails under strict package exports.
      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install

      # The first iOS-side assertions in this job, and they exist because the
      # Notification Service Extension fails SILENTLY. If the target is missing,
      # or the shared Keychain group never reaches the app's entitlements, the
      # app still builds, still installs, and still shows notifications - just
      # always the generic placeholder, which is indistinguishable from an
      # extension that was never installed. There is no crash to catch and no
      # iOS test tier to catch it in.
      - name: Confirm the Notification Service Extension target was injected
        run: |
          set -euo pipefail
          pbxproj="$(find ios -maxdepth 2 -name 'project.pbxproj' | head -n 1)"
          if [ -z "$pbxproj" ]; then
            echo "::error::No ios/*.xcodeproj/project.pbxproj after prebuild."
            exit 1
          fi

          if ! grep -q "KangenticNSE" "$pbxproj"; then
            echo "::error::No KangenticNSE target in the generated Xcode project."
            echo "::error::plugins/withIosNotificationServiceExtension.ts did not apply, so every iOS push would show the placeholder."
            exit 1
          fi
          if ! grep -q 'com.apple.product-type.app-extension' "$pbxproj"; then
            echo "::error::The KangenticNSE target is not an app-extension product type, so it would not be embedded or invoked."
            exit 1
          fi

          # Exactly one target: prebuild runs more than once in this workflow
          # (the Sentry-enabled pass below re-runs it), and a plugin that is not
          # idempotent would add a second target with a duplicate bundle id,
          # which App Store Connect rejects at upload.
          nse_target_count="$(grep -c 'PRODUCT_BUNDLE_IDENTIFIER = "com.kangentic.mobile.nse"' "$pbxproj" || true)"
          if [ "$nse_target_count" -ne 2 ]; then
            echo "::error::Expected the extension bundle id in exactly 2 build configurations (Debug and Release), found $nse_target_count."
            echo "::error::More than 2 means the plugin is not idempotent across repeated prebuilds."
            exit 1
          fi

          for source_file in NotificationService.swift HChaCha20.swift PushEnvelope.swift SharedKeychain.swift CategoryCopy.swift; do
            if [ ! -f "ios/KangenticNSE/$source_file" ]; then
              echo "::error::targets/nse/$source_file was not copied into the generated project."
              exit 1
            fi
          done
          if [ ! -f ios/KangenticNSE/Info.plist ] || [ ! -f ios/KangenticNSE/Kangentic-NSE.entitlements ]; then
            echo "::error::The extension's Info.plist or entitlements did not reach the generated project."
            exit 1
          fi
          if ! grep -q "com.apple.usernotifications.service" ios/KangenticNSE/Info.plist; then
            echo "::error::The extension's Info.plist has the wrong NSExtensionPointIdentifier, so iOS would never invoke it."
            exit 1
          fi
          echo "Notification Service Extension target, sources and Info.plist all present."

      - name: Confirm the app entitlements carry the shared Keychain group
        run: |
          set -euo pipefail
          entitlements="$(find ios -maxdepth 2 -name '*.entitlements' -not -path '*/KangenticNSE/*' | head -n 1)"
          if [ -z "$entitlements" ]; then
            echo "::error::No app entitlements file after prebuild."
            exit 1
          fi

          # Parsed as text, not with plutil: this job runs on ubuntu-latest and
          # plutil is macOS-only. The generated entitlements are an XML plist,
          # so the array order is the document order.
          if ! grep -q 'com.kangentic.mobile.shared' "$entitlements"; then
            echo "::error::The app entitlements do not carry the shared Keychain group."
            echo "::error::Without it the app writes the push key where the extension cannot read it."
            exit 1
          fi

          # ORDER IS LOAD BEARING. Once keychain-access-groups exists, an
          # unqualified SecItemAdd lands in the FIRST entry rather than the
          # implicit application-identifier group. The app-identifier group is
          # first precisely so device.identity.sk, the trust anchor and the
          # settings store keep their existing home; reversing it relocates all
          # three and the app reads as unpaired on next launch.
          first_group="$(sed -n '/<key>keychain-access-groups<\/key>/,/<\/array>/p' "$entitlements" \
            | grep -o '<string>[^<]*</string>' \
            | head -n 1 \
            | sed 's/<[^>]*>//g')"
          if [ "$first_group" != '$(AppIdentifierPrefix)com.kangentic.mobile' ]; then
            echo "::error::The first keychain-access-group is '$first_group', expected the application-identifier group."
            echo "::error::Every unqualified SecureStore write would silently move, and the app would read as unpaired."
            exit 1
          fi
          echo "App entitlements carry the shared Keychain group, application-identifier group first."

      # The two prebuilds above exercise only the INERT Sentry path. app.config.ts
      # omits the Sentry plugin entirely when SENTRY_AUTH_TOKEN is absent, and this
      # workflow deliberately holds no secrets, so without this step the plugin's
      # own file generation is tested by nothing short of a signed release build.
      # That is precisely the shape of hole that let a broken config-plugin import
      # reach iOS while every gate stayed green.
      #
      # A DUMMY token closes it and needs no secret, so it works on fork PRs too.
      # Prebuild only generates files: it writes the Gradle and Xcode wiring plus a
      # sentry.properties, and never contacts Sentry. Uploads happen later, during
      # Gradle and xcodebuild, which this job does not run - so a fake token cannot
      # reach the network or touch the real project.
      - name: Generate both native projects with the Sentry plugin ENABLED
        env:
          SENTRY_AUTH_TOKEN: dummy-token-for-ci-plugin-check
        run: npx expo prebuild --platform all --no-install

      - name: Confirm the Sentry plugin actually wired itself in
        # Guards against the plugin silently no-opping: if a future SDK version
        # changes how it injects, this fails loudly here instead of shipping a
        # release whose stack traces are all minified.
        #
        # BOTH platforms, for the reason spelled out on the prebuild steps above:
        # the plugin has two independent halves (withSentryAndroid appends to
        # build.gradle, withSentryIOS adds an Xcode build phase and writes
        # ios/sentry.properties), and checking only Android is the same blind spot
        # that let a broken config-plugin import reach an iOS build with every gate
        # green. The prebuild above already generated both, so this costs nothing.
        run: |
          set -euo pipefail
          if ! grep -q "sentry.gradle" android/app/build.gradle; then
            echo "::error::The Sentry Expo plugin did not add its Gradle integration. Release source maps would not upload, so every production Android stack trace would arrive minified."
            exit 1
          fi
          if [ ! -f android/sentry.properties ]; then
            echo "::error::The Sentry Expo plugin did not write android/sentry.properties, so sentry.gradle's upload task has no project to upload to."
            exit 1
          fi
          echo "Sentry plugin wired into the Android build."
          if ! grep -q "Upload Debug Symbols to Sentry" ios/*.xcodeproj/project.pbxproj; then
            echo "::error::The Sentry Expo plugin did not add its Xcode debug-symbol upload phase. Release dSYMs would not upload, so every production iOS crash would arrive unsymbolicated."
            exit 1
          fi
          if [ ! -f ios/sentry.properties ]; then
            echo "::error::The Sentry Expo plugin did not write ios/sentry.properties, so the Xcode upload phase has no project to upload to."
            exit 1
          fi
          echo "Sentry plugin wired into the iOS build."

          # Pin the org/project slug baked into both generated properties files.
          # app.config.ts's organization/project options are the only source for
          # this - sentry.gradle reads android/sentry.properties's defaults.org
          # and defaults.project straight into sentry-cli's --org/--project, so a
          # stale or partially renamed slug here 404s the upload and fails a real
          # release build outright rather than degrading quietly. Check BOTH
          # generated files: Android is the one that actually feeds sentry.gradle.
          for propertiesFile in android/sentry.properties ios/sentry.properties; do
            if ! grep -q "^defaults.org=kangentic$" "$propertiesFile"; then
              echo "::error::$propertiesFile does not set defaults.org=kangentic. The Sentry upload would 404 against the wrong org."
              exit 1
            fi
            if ! grep -q "^defaults.project=mobile$" "$propertiesFile"; then
              echo "::error::$propertiesFile does not set defaults.project=mobile. The Sentry upload would 404 against the old/wrong project slug."
              exit 1
            fi
          done
          echo "Sentry project slug (kangentic/mobile) wired into both generated properties files."

          # The Android Gradle Plugin half, which is what uploads the R8 mapping
          # file. It is enabled by app.config.ts's experimental_android block and
          # is worth its own assertion because withSentry.js wraps the call in a
          # try/catch that only warnOnce()s: a broken or renamed option leaves
          # prebuild green and silently stops uploading mappings.
          if ! grep -q "io.sentry.android.gradle" android/app/build.gradle; then
            echo "::error::The Sentry Android Gradle Plugin is not applied. R8 mapping files would not upload, so every Java/Kotlin frame in an Android crash would arrive as a.b.c()."
            exit 1
          fi
          # Match the ENABLED form, not the bare identifier. The generated block
          # always contains the word `autoUploadProguardMapping` - the plugin
          # writes `autoUploadProguardMapping = <shouldSentryAutoUpload()|false>`
          # either way - so grepping the name alone can only repeat what the
          # check above already proved, and would pass with the upload off.
          if ! grep -q "autoUploadProguardMapping = shouldSentryAutoUpload()" android/app/build.gradle; then
            echo "::error::The Sentry Gradle block does not auto-upload the ProGuard mapping, so R8-renamed Java/Kotlin frames would never be deobfuscated."
            grep -E "autoUploadProguardMapping|includeProguardMapping" android/app/build.gradle || true
            exit 1
          fi
          echo "Sentry Android Gradle Plugin wired in for R8 mapping upload."

      # R8 itself, which is independent of Sentry and applies to every release
      # build. Note WHICH file: expo-build-properties writes gradle.properties,
      # and the template's release block reads it through findProperty, so
      # `minifyEnabled true` never appears literally in build.gradle. Grepping
      # build.gradle here would fail against a perfectly correct config.
      - name: Confirm R8 is enabled for release builds
        run: |
          set -euo pipefail
          for property in android.enableMinifyInReleaseBuilds android.enableShrinkResourcesInReleaseBuilds; do
            if ! grep -q "^$property=true$" android/gradle.properties; then
              echo "::error::$property is not set to true in the generated android/gradle.properties. Release builds would ship unminified, which is what Play Console reports as \"App optimization: Low\"."
              grep -E "^android\.(enableMinify|enableShrinkResources)" android/gradle.properties || true
              exit 1
            fi
          done
          echo "R8 minification and resource shrinking are enabled for release builds."

      # The CMake staging relocation, which is what lets a local Android build
      # succeed from a Kangentic task worktree at any path depth. Checked HERE,
      # on Linux, and that is the whole
      # design: the Windows gate lives inside the generated Groovy rather than in
      # the config plugin, so prebuild output is identical on every platform and
      # this runner can prove the block landed. Had the plugin gated on
      # process.platform instead, this job could only ever have confirmed the
      # no-op.
      #
      # The failure this catches is the flag not ARRIVING, which is the failure
      # mode an anchor-guarded append actually has, and it is silent: the build
      # simply goes back to dying with `manifest 'build.ninja' still dirty after
      # 100 tries`, which names nothing.
      - name: Confirm the CMake staging block reached settings.gradle
        run: |
          set -euo pipefail
          settings=android/settings.gradle
          if ! grep -q '// kangentic:cmake-build-staging' "$settings"; then
            echo "::error::The CMake staging block is missing from the generated $settings. Local Android builds would go back to failing from any deep checkout path, with an error that names no file."
            exit 1
          fi
          if ! grep -q 'DCMAKE_OBJECT_PATH_MAX=259' "$settings"; then
            echo "::error::The staging block landed without -DCMAKE_OBJECT_PATH_MAX=259, so CMake would emit unshortened object paths and ninja would fail with 'Filename longer than 260 characters'."
            exit 1
          fi
          if ! grep -q 'gradle.beforeProject' "$settings"; then
            echo "::error::The staging block is not using gradle.beforeProject. AGP reads buildStagingDirectory during each module's own evaluation, so a root subprojects block throws 'It is too late to set buildStagingDirectory' and never reaches :app."
            exit 1
          fi
          echo "CMake staging block present in $settings."

      # PrivacyInfo.xcprivacy is a build artifact (app.config.ts's
      # ios.privacyManifests merges into the template's file at prebuild
      # time via @expo/config-plugins' withPrivacyInfo), so it never exists
      # as a tracked file, and no other workflow surfaces it: build-ios.yml
      # ships only the signed .ipa, and prebuild refuses to run for iOS on
      # Windows at all. Without this, confirming what the app actually
      # declares needs a full signed build. This job already generated it.
      - name: Upload the generated iOS privacy manifest
        uses: actions/upload-artifact@v7
        with:
          name: ios-privacy-manifest
          path: ios/*/PrivacyInfo.xcprivacy
          retention-days: 14
          if-no-files-found: error

      # Runs AFTER the privacy-manifest upload above, deliberately: that step
      # reads ios/ as produced by the Sentry-enabled `prebuild --platform all`,
      # and this one regenerates the ANDROID project with a different flag set.
      #
      # Same shape, and same reasoning, as the Sentry steps above: every prebuild
      # so far ran with EXPO_PUBLIC_KANGENTIC_E2E unset, so the ENABLED half of
      # the two e2e-only native carve-outs was exercised by nothing short of an
      # actual e2e APK build. Both are load-bearing for the paired Maestro suite
      # and both are one silent plugin no-op away from costing a whole CI run to
      # rediscover:
      #
      #   usesCleartextTraffic - without it Android refuses the dev relay's ws://
      #     socket before any of our code runs, and pairing reports a bare
      #     "connection closed (1006)".
      #   gwpAsanMode=never    - without it the sampling allocator can take the
      #     app down ~800ms after launchApp inside its own backtrace bookkeeping
      #     (run 30308333829). It presents as an ordinary assertVisible failure
      #     on whichever flow drew the sample, which reads as a product bug.
      #
      # No secret involved, so this works on fork PRs too.
      - name: Generate the native project with the E2E carve-outs ENABLED
        env:
          EXPO_PUBLIC_KANGENTIC_E2E: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Confirm the E2E-only manifest carve-outs actually landed
        # Only the ENABLED direction is checked here, because only it needs a
        # prebuild. The inert direction is a plain `if` inside each plugin, which
        # tests/unit/androidE2ePlugins.test.ts covers far more cheaply than a
        # second prebuild and a second grep would.
        run: |
          set -euo pipefail
          manifest=android/app/src/main/AndroidManifest.xml
          if ! grep -q 'android:usesCleartextTraffic="true"' "$manifest"; then
            echo "::error::The e2e build lost usesCleartextTraffic, so the app cannot reach the dev relay over ws:// and every paired Maestro flow would fail at pairing."
            exit 1
          fi
          if ! grep -q 'android:gwpAsanMode="never"' "$manifest"; then
            echo "::error::The e2e build lost gwpAsanMode=never, so GWP-ASan can crash the app moments after launch and redden an arbitrary paired flow."
            exit 1
          fi
          echo "Both E2E-only manifest carve-outs are present."

      - name: Confirm the CMake staging block did not stack on a repeat prebuild
        # Several prebuilds have now run over an existing android/, and prebuild
        # is the only place the append's idempotency guard is exercised for real.
        # tests/unit/androidCmakeBuildStaging.test.ts calls the transform twice,
        # but only prebuild decides whether settings.gradle is regenerated from
        # the template or merged into, and a stacked block means two conflicting
        # gradle.beforeProject hooks racing to set the same staging directory.
        run: |
          set -euo pipefail
          settings=android/settings.gradle
          # `|| true` is load-bearing: grep -c exits 1 when the count is zero, so
          # under `set -e` a MISSING block would abort the assignment and kill the
          # step before the error below could name what went wrong. Zero is the
          # more important failure here (prebuild regenerated settings.gradle from
          # the template without the block), so it must reach the message.
          anchors=$(grep -c '// kangentic:cmake-build-staging' "$settings" || true)
          if [ "$anchors" -ne 1 ]; then
            echo "::error::Expected exactly 1 CMake staging block in $settings after repeated prebuilds, found $anchors. Zero means prebuild regenerated the file without it; more than one means the anchor guard in withAndroidCmakeBuildStaging.ts is not holding."
            exit 1
          fi
          echo "CMake staging block present exactly once after repeated prebuilds."

      - name: Confirm the generated project is not committed
        # CNG: android/ must exist only as a build artifact. If prebuild output
        # ever shows up as tracked changes, someone committed the native tree.
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain -- android ios)" ]; then
            echo "::error::prebuild produced tracked changes under android/ or ios/. Those directories must stay gitignored (see .claude/rules/expo-cng.md)."
            git status --porcelain -- android ios
            exit 1
          fi
          echo "Native project generated cleanly and stayed untracked."

  # Catches a release counter that is already spent on a store, at PR time
  # instead of at release time. This is precisely the check that was missing on
  # 2026-07-28: app.config.ts declared ios.buildNumber 3, Apple had already
  # taken 3, and nothing noticed until the release dispatch failed.
  #
  # It runs ONLY when the PR actually changes a counter's value, and that
  # condition is load bearing. Between releases the declared counter is the one
  # just shipped, so asserting "the declared counter is free" unconditionally
  # would leave main permanently red until somebody bumped it. A release PR is
  # the one moment the assertion is both meaningful and free.
  #
  # The only gate that checks the Notification Service Extension's crypto is
  # correct rather than merely compiling.
  #
  # The extension re-implements XChaCha20-Poly1305 in Swift because CryptoKit
  # ships only the 96-bit-nonce IETF variant. Nothing else in this repository
  # can catch a mistake in it: there is no iOS test tier, the developer machine
  # is Windows, and build-ios.yml's simulator job proves only that the target
  # compiles. A wrong subkey derivation produces a clean decrypt failure, not a
  # crash, so the sole symptom would be every iPhone notification silently
  # showing the generic placeholder.
  #
  # This job opens envelopes sealed by the protocol package's own
  # sealPushEnvelope, and checks the tamper, wrong-key, wrong-AAD and staleness
  # paths reject. It runs on ci.yml rather than build-ios.yml deliberately:
  # build-ios.yml is dispatch-only, so a broken crypto change would merge green.
  #
  # THIS IS A REQUIRED STATUS CHECK on main, so its `name:` is a protection
  # context and cannot be renamed without updating protection in the same
  # change. See the job-name note at the top of this file.
  #
  # macOS minutes are billable on private repositories; this one is public, so
  # they are free. It compiles three small files with swiftc and needs no Xcode
  # project, no simulator, and no signing.
  nse-crypto:
    name: NSE crypto (swiftc)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # NotificationService.swift and SharedKeychain.swift are deliberately not
      # compiled here: UNNotificationServiceExtension is iOS-only, and the
      # Keychain needs a signed, entitled process. Neither is available to a
      # macOS command-line binary, and neither is what this job is testing.
      - name: Compile the extension crypto
        run: |
          set -euo pipefail
          swiftc -O \
            -o "$RUNNER_TEMP/nseCryptoHarness" \
            targets/nse/HChaCha20.swift \
            targets/nse/PushEnvelope.swift \
            targets/nse/CategoryCopy.swift \
            tests/swift/nseCryptoHarness.swift

      - name: Open envelopes sealed by @kangentic/protocol
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/nseCryptoHarness" tests/swift/pushEnvelopeFixtures.json

  # Change detection compares the RESOLVED VALUE at the base against the value
  # at HEAD, rather than looking for the field in the diff text. Those are not
  # the same test: editing a comment next to `versionCode:` shows up in the
  # diff without changing anything that ships, and this job must not fail for
  # that. The commit that recorded which counters v0.2.0 spent did exactly that.
  #
  # THIS IS NOW A REQUIRED STATUS CHECK on main (promoted 2026-07-28), so its
  # `name:` below is a protection context and cannot be renamed without updating
  # protection in the same change. See the job-name note at the top of this file.
  #
  # It runs on `pull_request` only, which is deliberate and worth understanding
  # before anyone widens the trigger: a required context that never reports on a
  # given event would block every merge that arrives by that path.
  release-counters:
    name: Release counters (stores)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The base commit has to exist locally for the comparison below.
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-deps

      - name: Detect which counters this PR changes
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Anchored at line start so the many comments mentioning versionCode
          # and buildNumber by name cannot match: comments begin with //.
          extract_version_code() { grep -oE "^[[:space:]]*versionCode:[[:space:]]*[0-9]+" | grep -oE "[0-9]+" | head -n 1; }
          extract_build_number() { grep -oE "^[[:space:]]*buildNumber:[[:space:]]*'[0-9]+'" | grep -oE "[0-9]+" | head -n 1; }

          git show "$BASE_SHA:app.config.ts" > "$RUNNER_TEMP/base-app.config.ts"
          base_version_code="$(extract_version_code < "$RUNNER_TEMP/base-app.config.ts" || true)"
          base_build_number="$(extract_build_number < "$RUNNER_TEMP/base-app.config.ts" || true)"
          head_version_code="$(extract_version_code < app.config.ts || true)"
          head_build_number="$(extract_build_number < app.config.ts || true)"

          echo "versionCode: base=${base_version_code:-none} head=${head_version_code:-none}"
          echo "buildNumber: base=${base_build_number:-none} head=${head_build_number:-none}"

          # FAIL CLOSED when the detector cannot read the HEAD config, and check
          # it BEFORE the comparison below. Same fail-open family as the e2e gate
          # in e2e.yml, and easy to miss for the same reason: both extractions
          # carry `|| true`, because `grep` exits 1 on no match and `set -e` is
          # on. So a regex that stops matching (a reformat, a counter moved into
          # a nested or computed expression, `buildNumber` requoted) yields empty
          # on BOTH sides, empty equals empty, no counter looks changed, and this
          # REQUIRED check reports green having preflighted nothing. The next
          # release then fails at the store, which is the exact incident this job
          # exists to prevent.
          #
          # Only HEAD is guarded. An empty BASE is legitimate: it is what a
          # brand-new counter field looks like on the base commit.
          if [ -z "$head_version_code" ] || [ -z "$head_build_number" ]; then
            echo "::error::Could not read versionCode and/or buildNumber out of app.config.ts (versionCode='${head_version_code:-}', buildNumber='${head_build_number:-}'). The detector cannot tell whether this PR bumps a counter, so it fails closed rather than reporting green. Fix the extraction regexes in this step to match app.config.ts's current shape."
            exit 1
          fi

          android=false
          ios=false
          if [ "$base_version_code" != "$head_version_code" ]; then android=true; fi
          if [ "$base_build_number" != "$head_build_number" ]; then ios=true; fi
          echo "android=$android" >> "$GITHUB_OUTPUT"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

      - name: Read the declared counters
        id: declared
        if: steps.changed.outputs.android == 'true' || steps.changed.outputs.ios == 'true'
        run: |
          set -euo pipefail
          # The regex above is only a change DETECTOR. The value actually
          # checked against the store comes from the resolved Expo config, the
          # same source the build and submit jobs read.
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          read_config_field() {
            node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String($1))" "$RUNNER_TEMP/expo-config.json"
          }
          echo "version-name=$(read_config_field 'c.version')" >> "$GITHUB_OUTPUT"
          echo "version-code=$(read_config_field 'c.android.versionCode')" >> "$GITHUB_OUTPUT"
          echo "build-number=$(read_config_field 'c.ios.buildNumber')" >> "$GITHUB_OUTPUT"

      - name: Check the Play version code is free
        if: steps.changed.outputs.android == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          VERSION_CODE: ${{ steps.declared.outputs.version-code }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::warning::No PLAY_SERVICE_ACCOUNT_JSON, which is expected on a fork PR, so versionCode $VERSION_CODE was NOT checked against Play. The submit job still checks it."
            exit 0
          fi
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          node scripts/checkPlayVersionCode.mjs --key "$RUNNER_TEMP/play-service-account.json" --package com.kangentic.mobile --version-code "$VERSION_CODE"

      - name: Check the App Store build number is free
        if: steps.changed.outputs.ios == 'true'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.declared.outputs.build-number }}
          VERSION_NAME: ${{ steps.declared.outputs.version-name }}
        run: |
          set -euo pipefail
          if [ -z "${ASC_API_KEY_BASE64:-}" ]; then
            echo "::warning::No ASC_API_KEY_BASE64, which is expected on a fork PR, so buildNumber $BUILD_NUMBER was NOT checked against App Store Connect. The device build still checks it."
            exit 0
          fi
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc-api-key.p8"
          node scripts/checkAppStoreBuild.mjs \
            --key "$RUNNER_TEMP/asc-api-key.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id com.kangentic.mobile \
            --version "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER"

      - name: Note when no counter changed
        if: steps.changed.outputs.android != 'true' && steps.changed.outputs.ios != 'true'
        run: echo "No release counter changed in app.config.ts, so there is nothing to preflight."
