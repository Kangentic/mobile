name: Build Android

# Builds on the GitHub runner with Gradle, not on EAS servers, so a build costs
# no EAS cloud credit and no GitHub Actions minutes (standard runners are free
# and unmetered on public repositories). See the CI builds section of
# docs/developer-guide.md.
#
# There is deliberately no pull_request trigger: a full native build adds real
# minutes for little signal. .github/workflows/ci.yml stays the PR gate.
#
# Speed: native compilation dominates. The first unrestricted run spent 1665 of
# 1770 seconds inside Gradle, nearly all of it compiling C++ for four ABIs. So
# each profile builds only the ABI its target actually runs
# (scripts/androidAbis.mjs), and selecting several profiles fans them out across
# runners instead of building them back to back.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile, or "all" to build every profile in parallel'
        type: choice
        default: preview
        options:
          - development
          - preview
          - e2e
          - production
          - all
      artifact:
        description: 'Artifact type (auto follows the eas.json profile)'
        type: choice
        default: auto
        options:
          - auto
          - apk
          - aab
      abis:
        description: 'ABI override, comma-separated. Empty uses the per-profile default.'
        type: string
        default: ''
      submit_track:
        description: 'Play track to submit to. "none" builds the artifact only.'
        type: choice
        default: none
        options:
          - none
          - internal
          - alpha
          - beta
  push:
    tags:
      - 'v*'

concurrency:
  # Keyed on the selection too, so a preview dispatch does not cancel an
  # in-flight production build.
  group: build-android-${{ github.ref }}-${{ github.event.inputs.profile || 'tag' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job display names follow the convention in ci.yml and the kangentic desktop
  # repo: a lowercase key to reference, plus a Title Case `name` with a
  # parenthetical saying which tool or target it is. Without one the Actions UI
  # shows the raw key, which reads like an internal detail.
  #
  # Safe to rename here, unlike in ci.yml and e2e.yml, where a job name IS the
  # branch-protection status-check context. Neither build workflow is a required
  # check: both are dispatch or tag triggered, and requiring a check that never
  # runs on a PR would deadlock every PR.
  plan:
    name: Plan (resolve build matrix)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      profiles: ${{ steps.matrix.outputs.profiles }}
    steps:
      - uses: actions/checkout@v4

      # Pinned rather than relying on whatever Node the runner image ships: this
      # job decides the matrix, so if it breaks nothing builds at all.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Resolve the profile matrix
        id: matrix
        env:
          # A tag build is always the store artifact.
          SELECTED: ${{ github.event_name == 'push' && 'production' || inputs.profile }}
        run: |
          set -euo pipefail
          if [ "$SELECTED" = "all" ]; then
            profiles="$(node --input-type=module -e "import {readEasProfileNames} from './scripts/androidAbis.mjs'; process.stdout.write(JSON.stringify(readEasProfileNames()))")"
          else
            profiles="$(node -e "process.stdout.write(JSON.stringify([process.argv[1]]))" "$SELECTED")"
          fi
          echo "profiles=$profiles" >> "$GITHUB_OUTPUT"
          echo "Building: $profiles"

  build-android:
    # Named after the profile, so a `profile=all` fan-out reads as four
    # distinguishable jobs rather than four identical rows. Same pattern as
    # ci.yml's shard names.
    name: Build (${{ matrix.profile }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One profile failing must not cancel the others: a matrix run is often
      # "give me every artifact", and a partial set still has value.
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(needs.plan.outputs.profiles) }}
    env:
      BUILD_PROFILE: ${{ matrix.profile }}
      REQUESTED_ARTIFACT: ${{ github.event_name == 'push' && 'aab' || inputs.artifact }}
      ABI_OVERRIDE: ${{ github.event_name == 'push' && '' || inputs.abis }}
      # Secrets cannot be referenced from an `if:` condition, so presence is
      # resolved once here as a plain boolean and the steps branch on that.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # eas.json stays the source of truth for per-profile env even though the
      # build itself runs on Gradle. EXPO_PUBLIC_* values are read by
      # app.config.ts at config-evaluation time (prebuild) AND inlined by Metro
      # during bundleReleaseJsAndAssets, so this must run before prebuild, not
      # merely before Gradle. tests/unit/buildWorkflow.test.ts locks that order.
      - name: Export the profile env from eas.json
        run: node scripts/easProfile.mjs "$BUILD_PROFILE" --github-env

      - name: Resolve the build plan
        id: plan
        run: |
          set -euo pipefail

          build_type="$(node scripts/easProfile.mjs "$BUILD_PROFILE" --field android.buildType)"
          distribution="$(node scripts/easProfile.mjs "$BUILD_PROFILE" --field distribution)"

          artifact="$REQUESTED_ARTIFACT"
          if [ "$artifact" = "auto" ]; then
            if [ "$build_type" = "apk" ]; then
              artifact="apk"
            elif [ "$build_type" = "app-bundle" ]; then
              artifact="aab"
            elif [ "$distribution" = "internal" ]; then
              # EAS defaults internal distribution to an installable APK.
              artifact="apk"
            else
              artifact="aab"
            fi
          fi

          # ABIs: explicit override wins, otherwise the per-profile default.
          if [ -n "$ABI_OVERRIDE" ]; then
            abis="$ABI_OVERRIDE"
          else
            abis="$(node scripts/androidAbis.mjs "$BUILD_PROFILE")"
          fi

          # The development profile is a dev-client build, which is the debug
          # variant; every other profile builds release.
          variant="release"
          if [ "$BUILD_PROFILE" = "development" ]; then variant="debug"; fi

          # Without a keystore secret we can still prove that prebuild, Gradle,
          # and the ABI set all work. Fall back to the debug variant, which is
          # signed with the throwaway debug key, rather than emitting an
          # unsigned release artifact that looks installable but is not.
          signed="true"
          if [ "$HAS_KEYSTORE" != "true" ]; then
            signed="false"
            variant="debug"
            artifact="apk"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Building a debug-signed APK smoke build instead of a release artifact."
          fi

          if [ "$artifact" = "aab" ]; then
            task=":app:bundleRelease"
            output_path="android/app/build/outputs/bundle/release/app-release.aab"
            extension="aab"
          elif [ "$variant" = "debug" ]; then
            task=":app:assembleDebug"
            output_path="android/app/build/outputs/apk/debug/app-debug.apk"
            extension="apk"
          else
            task=":app:assembleRelease"
            output_path="android/app/build/outputs/apk/release/app-release.apk"
            extension="apk"
          fi

          {
            echo "artifact=$artifact"
            echo "variant=$variant"
            echo "task=$task"
            echo "output-path=$output_path"
            echo "extension=$extension"
            echo "signed=$signed"
            echo "abis=$abis"
          } >> "$GITHUB_OUTPUT"

          echo "Profile $BUILD_PROFILE -> $extension ($variant), ABIs: $abis"

      - name: Materialize google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # app.config.ts only wires FCM when this file exists at the repo root
          # (it is gitignored), so without this step a release build ships with
          # remote push silently disabled.
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json
          echo "Wrote google-services.json ($(wc -c < google-services.json) bytes)."

      - name: Warn when google-services.json is absent
        if: env.HAS_GOOGLE_SERVICES != 'true'
        run: echo "::warning::GOOGLE_SERVICES_JSON is not set. This build ships without FCM config, so remote push will not work."

      - name: Decode the upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kangentic-upload.jks"
          echo "Decoded keystore ($(wc -c < "$RUNNER_TEMP/kangentic-upload.jks") bytes)."

      - name: Generate the native Android project
        # CNG: android/ is produced here and never committed. See
        # .claude/rules/expo-cng.md. --no-install because npm ci already ran.
        run: npx expo prebuild --platform android --no-install

      # Deliberately after prebuild: android/ does not exist at checkout time,
      # so an earlier setup-gradle would have no Gradle files to key its cache
      # on. The cache is per-profile because the ABI set differs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Read the app version
        id: version
        run: |
          set -euo pipefail
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          read_config_field() {
            node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String($1))" "$RUNNER_TEMP/expo-config.json"
          }
          version_name="$(read_config_field 'c.version')"
          version_code="$(read_config_field 'c.android.versionCode')"
          echo "version-name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building version $version_name (versionCode $version_code)."

      - name: Build with Gradle
        env:
          # Secrets are referenced as shell variables rather than interpolated
          # into the command line, so the rendered run script in the log never
          # contains the values.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_TASK: ${{ steps.plan.outputs.task }}
          BUILD_ABIS: ${{ steps.plan.outputs.abis }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew

          # --parallel: a React Native project is many Gradle modules (one per
          #   autolinked native library), so parallel project execution is a
          #   real win rather than a no-op.
          # --build-cache: setup-gradle caches GRADLE_USER_HOME, which includes
          #   the local build cache, so non-native tasks (Java compile, dex,
          #   resource processing) can hit across runs. Gradle keys cache
          #   entries on task inputs, so this cannot produce a stale artifact.
          gradle_arguments=(
            "$GRADLE_TASK"
            -x lint
            -x test
            --parallel
            --build-cache
            "-PreactNativeArchitectures=$BUILD_ABIS"
          )

          if [ "$HAS_KEYSTORE" = "true" ]; then
            # Injected signing properties override the generated project without
            # touching it, which keeps the CNG rule intact. This mirrors the
            # local recipe in the Android release section of
            # docs/developer-guide.md.
            gradle_arguments+=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/kangentic-upload.jks"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            )
          fi

          cd android
          ./gradlew "${gradle_arguments[@]}"

      # A build that goes green while producing an unsigned or debug-signed
      # artifact is the failure mode worth guarding: Play rejects it, but only
      # after a human has spent the upload. Fail here instead.
      - name: Verify the artifact is signed with the upload key
        if: steps.plan.outputs.signed == 'true'
        env:
          OUTPUT_PATH: ${{ steps.plan.outputs.output-path }}
          EXTENSION: ${{ steps.plan.outputs.extension }}
        run: bash .github/scripts/verify-android-signature.sh "$OUTPUT_PATH" "$EXTENSION"

      - name: Verify the artifact carries the expected ABIs
        env:
          OUTPUT_PATH: ${{ steps.plan.outputs.output-path }}
          EXTENSION: ${{ steps.plan.outputs.extension }}
          BUILD_ABIS: ${{ steps.plan.outputs.abis }}
        run: bash .github/scripts/verify-android-abis.sh "$OUTPUT_PATH" "$EXTENSION" "$BUILD_ABIS"

      - name: Name the artifact
        id: name
        env:
          OUTPUT_PATH: ${{ steps.plan.outputs.output-path }}
          EXTENSION: ${{ steps.plan.outputs.extension }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
        run: |
          set -euo pipefail
          artifact_name="kangentic-$BUILD_PROFILE-v$VERSION_NAME-vc$VERSION_CODE-${GITHUB_SHA::7}"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          cp "$OUTPUT_PATH" "$RUNNER_TEMP/$artifact_name.$EXTENSION"

      - name: Write the build summary
        env:
          EXTENSION: ${{ steps.plan.outputs.extension }}
          VARIANT: ${{ steps.plan.outputs.variant }}
          SIGNED: ${{ steps.plan.outputs.signed }}
          BUILD_ABIS: ${{ steps.plan.outputs.abis }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
        run: |
          {
            echo "### Android build: \`$BUILD_PROFILE\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Artifact | \`$EXTENSION\` ($VARIANT) |"
            echo "| Version | \`$VERSION_NAME\` (code \`$VERSION_CODE\`) |"
            echo "| ABIs | \`$BUILD_ABIS\` |"
            echo "| Signed with upload key | \`$SIGNED\` |"
            echo ""
            echo "Bump \`android.versionCode\` in \`app.config.ts\` before every Play upload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifact to the run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ steps.name.outputs.artifact-name }}.${{ steps.plan.outputs.extension }}
          # ~50 to 140 MB per artifact. The 90-day default accrues storage
          # billing even on a public repository.
          retention-days: 14
          if-no-files-found: error

  # Never runs unless a dispatch explicitly names a track, and even then it
  # waits on the google-play environment's required reviewer. The very first
  # AAB for this package has to be uploaded by hand through the Play Console
  # UI: the Play Developer API only works once an app has at least one release.
  #
  # It re-verifies the downloaded artifact rather than trusting a job output,
  # which also keeps it correct with a matrix build (matrix job outputs are not
  # per-instance addressable).
  submit-play:
    name: Submit (Google Play)
    needs: build-android
    if: github.event_name == 'workflow_dispatch' && inputs.submit_track != 'none' && inputs.profile != 'all'
    runs-on: ubuntu-latest
    environment: google-play
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Download the built artifact
        uses: actions/download-artifact@v4
        with:
          pattern: kangentic-${{ inputs.profile }}-*
          merge-multiple: true
          path: artifact

      - name: Verify the artifact is signed with the upload key
        run: |
          set -euo pipefail
          file="$(ls artifact/* | head -n 1)"
          echo "Submitting $file"
          bash .github/scripts/verify-android-signature.sh "$file" "${file##*.}"

      - name: Install dependencies
        run: npm ci

      - name: Check the version code is free on every track
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          version_code="$(node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String(c.android.versionCode))" "$RUNNER_TEMP/expo-config.json")"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          node scripts/checkPlayVersionCode.mjs --key "$RUNNER_TEMP/play-service-account.json" --package com.kangentic.mobile --version-code "$version_code"

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kangentic.mobile
          releaseFiles: artifact/*
          track: ${{ inputs.submit_track }}
          status: completed
