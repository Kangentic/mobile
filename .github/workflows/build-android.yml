name: Build Android

# Builds on the GitHub runner with Gradle, not on EAS servers, so a build costs
# no EAS cloud credit and no GitHub Actions minutes (standard runners are free
# and unmetered on public repositories). See the CI builds section of
# docs/developer-guide.md.
#
# There is deliberately no pull_request trigger: a full native build adds real
# minutes for little signal. .github/workflows/ci.yml stays the PR gate.
#
# Speed: native compilation dominates. The first unrestricted run spent 1665 of
# 1770 seconds inside Gradle, nearly all of it compiling C++ for four ABIs. So
# each profile builds only the ABI its target actually runs
# (scripts/androidAbis.mjs). One dispatch builds ONE profile; wanting several
# means several dispatches, each its own run (the concurrency group is keyed
# per profile, so they do not cancel each other). A `profile=all` matrix
# fan-out existed for a while, "implemented but unmeasured": it was never once
# used, could never submit, and its one-element matrix wrapped every real
# build in a "Matrix:" group in the Actions UI that read as a broken fan-out.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile'
        type: choice
        default: preview
        options:
          - development
          - preview
          - e2e
          - production
      artifact:
        description: 'Artifact type (auto follows the eas.json profile)'
        type: choice
        default: auto
        options:
          - auto
          - apk
          - aab
      abis:
        description: 'ABI override, comma-separated. Empty uses the per-profile default.'
        type: string
        default: ''
      submit_track:
        description: 'Play track to submit to. "none" builds the artifact only.'
        type: choice
        default: none
        options:
          - none
          - internal
          - alpha
          - beta
      rollout:
        description: 'Fraction of users for a staged rollout, e.g. 0.1. Empty means release to everyone.'
        type: string
        default: ''
      crash_test:
        description: 'Reveal the crash-reporting test rows in Settings. For verifying what a crash report contains; never for a store submission.'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  # Keyed on the selection too, so a preview dispatch does not cancel an
  # in-flight production build.
  group: build-android-${{ github.ref }}-${{ github.event.inputs.profile || 'tag' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job display names follow the convention in ci.yml and the kangentic desktop
  # repo: a lowercase key to reference, plus a Title Case `name` with a
  # parenthetical saying which tool or target it is. Without one the Actions UI
  # shows the raw key, which reads like an internal detail.
  #
  # Safe to rename here, unlike in ci.yml and e2e.yml, where a job name IS the
  # branch-protection status-check context. Neither build workflow is a required
  # check: both are dispatch or tag triggered, and requiring a check that never
  # runs on a PR would deadlock every PR.
  plan:
    name: Plan (preflight)
    runs-on: ubuntu-latest
    # Was 5. The version-code preflight below needs node_modules to run
    # `expo config`, and a cold node_modules cache pays an npm ci here.
    timeout-minutes: 15
    outputs:
      profile: ${{ steps.profile.outputs.profile }}
    steps:
      - uses: actions/checkout@v7

      # Node pinned from .nvmrc, plus the shared node_modules cache, because the
      # version-code preflight below reads the resolved Expo config. This job
      # decides the profile and gates the build, so if it breaks nothing
      # builds at all.
      #
      # The composite action is also where the Node 24 bump lives, so this picks
      # it up without naming a version here.
      - uses: ./.github/actions/setup-node-deps

      # The crash-test flag reveals a Sentry.nativeCrash() button and turns on
      # verbose native SDK logging, so that artifact must never reach a store
      # track. The CRASH_TEST expression below only excludes a `push` (tag)
      # build, and a tag is NOT how this project releases: CLAUDE.md documents
      # the release path as a DISPATCH with `-f submit_track=internal`, which
      # that expression does not cover at all. So one dispatch carrying both
      # `crash_test: true` and a real `submit_track` would build a crash-test
      # APK and upload it to Play. Refused here, in the job everything else
      # needs, so it costs one cheap job rather than a full build.
      - name: Refuse a crash-test build that is also a store submission
        if: inputs.crash_test == true && inputs.submit_track != 'none'
        run: |
          set -euo pipefail
          echo "::error::crash_test and submit_track are mutually exclusive. A crash-test build reveals the Settings crash rows and enables Sentry debug logging, so it must never be submitted to a Play track. Dispatch them as two separate runs."
          exit 1

      # A `completed` Play release cannot be halted, only superseded by a higher
      # version code, so an unstaged release to a track with real users is
      # irreversible the moment it lands. That was previously a prose rule in
      # .claude/skills/release/SKILL.md telling the operator to pass
      # `-f rollout=0.1`, which is exactly the kind of rule that holds until the
      # one time somebody is in a hurry. Refused here instead, in the same job
      # and the same style as the crash-test refusal above.
      #
      # `internal` is deliberately exempt: the track is small, known, and the
      # documented escape hatch for it is simply shipping a higher version code.
      - name: Refuse an unstaged release to a track with real users
        if: (inputs.submit_track == 'alpha' || inputs.submit_track == 'beta') && inputs.rollout == ''
        run: |
          set -euo pipefail
          echo "::error::submit_track '${{ inputs.submit_track }}' needs an explicit staged rollout, e.g. -f rollout=0.1. Play can only HALT a release whose status is inProgress, which is what a userFraction rollout produces; a completed release can never be pulled back, only superseded by a higher versionCode. Re-dispatch with a rollout, or use submit_track=internal."
          exit 1

      # Preflight the version code HERE rather than only in submit-play, because
      # that job carries `environment: google-play` and its own check is step 7
      # INSIDE it. The old ordering was: build for ~25 minutes, ask a human to
      # approve, and only then discover the number was spent. iOS already got
      # this right (build-ios.yml checks before `xcodebuild archive`), and the
      # asymmetry cost a real release run on 2026-07-28.
      #
      # The check in submit-play stays. It is not redundant: it re-checks after
      # the build, which is the window where a release cut from another machine
      # could take the number.
      #
      # Skipped when nothing will be submitted, so an artifact-only build never
      # needs the Play credential.
      - name: Check the version code is free on every track
        if: github.event_name == 'workflow_dispatch' && inputs.submit_track != 'none'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "::error::submit_track is '${{ inputs.submit_track }}' but PLAY_SERVICE_ACCOUNT_JSON is not set, so the version code cannot be preflighted and the submit would fail after a full build."
            exit 1
          fi
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          version_code="$(node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String(c.android.versionCode))" "$RUNNER_TEMP/expo-config.json")"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          node scripts/checkPlayVersionCode.mjs --key "$RUNNER_TEMP/play-service-account.json" --package com.kangentic.mobile --version-code "$version_code"

      - name: Resolve the profile
        id: profile
        env:
          # A tag build is always the store artifact.
          SELECTED: ${{ github.event_name == 'push' && 'production' || inputs.profile }}
        run: |
          set -euo pipefail
          echo "profile=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "Building: $SELECTED"

  build-android:
    # Named after the profile so the Actions UI says what a run built without
    # expanding it. Deliberately NOT a matrix job: the only matrix use was the
    # never-exercised `profile=all` fan-out, and a one-element matrix wrapped
    # this job in a "Matrix:" group that read as a broken fan-out on every
    # real run.
    name: Build (${{ needs.plan.outputs.profile }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD_PROFILE: ${{ needs.plan.outputs.profile }}
      REQUESTED_ARTIFACT: ${{ github.event_name == 'push' && 'aab' || inputs.artifact }}
      ABI_OVERRIDE: ${{ github.event_name == 'push' && '' || inputs.abis }}
      # Secrets cannot be referenced from an `if:` condition, so presence is
      # resolved once here as a plain boolean and the steps branch on that.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
      # The DSN is a repository VARIABLE, not a secret, and deliberately so: it
      # ships inside the public app bundle, so it is not confidential, and a
      # variable can be read back (`gh variable list`) to confirm which Sentry
      # project a build is wired to. A secret cannot, which would leave a
      # mistyped DSN undetectable - builds would report nowhere and look fine.
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_DSN != '' }}
      # A tag build (store artifact) never carries the crash-test rows,
      # regardless of what a stale dispatch input might say.
      CRASH_TEST: ${{ github.event_name != 'push' && inputs.crash_test == true }}

    steps:
      - uses: actions/checkout@v7

      # The composite, like the plan job above, rather than a raw setup-node plus
      # an unconditional `npm ci`. This job used to pay a full install on every
      # run while the rest of the repository restored node_modules from a cache
      # keyed on the same lockfile - the composite's own description says every
      # CI job shares that key, and this was the job that did not.
      - uses: ./.github/actions/setup-node-deps

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v4's bump also moves the default cmdline-tools to 20.0; see the same
      # `uses:` in e2e.yml for what to suspect first if this job breaks.
      - uses: android-actions/setup-android@v4

      # eas.json stays the source of truth for per-profile env even though the
      # build itself runs on Gradle. EXPO_PUBLIC_* values are read by
      # app.config.ts at config-evaluation time (prebuild) AND inlined by Metro
      # during bundleReleaseJsAndAssets, so this must run before prebuild, not
      # merely before Gradle. tests/unit/buildWorkflow.test.ts locks that order.
      - name: Export the profile env from eas.json
        run: node scripts/easProfile.mjs "$BUILD_PROFILE" --github-env

      # Crash reporting is the one build-time value that CANNOT live in
      # eas.json: that file is committed to a public repo, and a DSN baked
      # into a fork's build would send that fork's crashes into this
      # project's (free-tier, 5k/month) Sentry project. That is a quota and
      # noise concern, NOT confidentiality - see the HAS_SENTRY comment.
      # Everything stays inert without these: no DSN means
      # src/observability/crashReporting.ts never calls Sentry.init(), and no
      # auth token means app.config.ts omits the Sentry plugin entirely.
      #
      # Must precede prebuild for the same reason the eas.json export does:
      # app.config.ts reads SENTRY_AUTH_TOKEN at config-evaluation time to
      # decide whether to add the plugin, and GITHUB_ENV only affects LATER
      # steps. tests/unit/buildWorkflow.test.ts locks that order.
      - name: Export the Sentry build env
        if: env.HAS_SENTRY == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          set -euo pipefail
          # The token is a real secret (it can upload releases), so mask it in
          # case a later tool echoes it. The DSN is deliberately NOT masked:
          # it ships in the published app bundle, so it is already public, and
          # leaving it legible lets this log answer "which Sentry project did
          # this build report to?" without guessing.
          echo "::add-mask::$SENTRY_AUTH_TOKEN"
          echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_SENTRY_DSN=$SENTRY_DSN" >> "$GITHUB_ENV"
          echo "Sentry is enabled for this build: source maps upload and crash reporting is active."
          echo "Reporting to: $SENTRY_DSN"

      - name: Note when Sentry is not configured
        if: env.HAS_SENTRY != 'true'
        run: echo "::notice::SENTRY_AUTH_TOKEN/SENTRY_DSN are not both set. This build ships with crash reporting inert and uploads no source maps."

      # Same ordering requirement as the exports above: EXPO_PUBLIC_* is read
      # at config-evaluation time and inlined by Metro, so this must precede
      # prebuild. tests/unit/buildWorkflow.test.ts locks that order. Never in
      # eas.json, for the same fork-quota reason as the Sentry export - this
      # is dispatch-only and defaults to off.
      - name: Export the crash-test flag
        if: env.CRASH_TEST == 'true'
        run: |
          set -euo pipefail
          echo "EXPO_PUBLIC_KANGENTIC_CRASHTEST=1" >> "$GITHUB_ENV"
          echo "::notice::Crash-test rows are enabled in Settings for this build. Do not submit this artifact to a store track."

      - name: Resolve the build plan
        id: plan
        run: |
          set -euo pipefail

          build_type="$(node scripts/easProfile.mjs "$BUILD_PROFILE" --field android.buildType)"
          distribution="$(node scripts/easProfile.mjs "$BUILD_PROFILE" --field distribution)"

          artifact="$REQUESTED_ARTIFACT"
          if [ "$artifact" = "auto" ]; then
            if [ "$build_type" = "apk" ]; then
              artifact="apk"
            elif [ "$build_type" = "app-bundle" ]; then
              artifact="aab"
            elif [ "$distribution" = "internal" ]; then
              # EAS defaults internal distribution to an installable APK.
              artifact="apk"
            else
              artifact="aab"
            fi
          fi

          # ABIs: explicit override wins, otherwise the per-profile default.
          if [ -n "$ABI_OVERRIDE" ]; then
            abis="$ABI_OVERRIDE"
          else
            abis="$(node scripts/androidAbis.mjs "$BUILD_PROFILE")"
          fi

          # The development profile is a dev-client build, which is the debug
          # variant; every other profile builds release.
          variant="release"
          if [ "$BUILD_PROFILE" = "development" ]; then variant="debug"; fi

          # Without a keystore secret we can still prove that prebuild, Gradle,
          # and the ABI set all work. Fall back to the debug variant, which is
          # signed with the throwaway debug key, rather than emitting an
          # unsigned release artifact that looks installable but is not.
          signed="true"
          if [ "$HAS_KEYSTORE" != "true" ]; then
            signed="false"
            variant="debug"
            artifact="apk"
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set. Building a debug-signed APK smoke build instead of a release artifact."
          fi

          if [ "$artifact" = "aab" ]; then
            task=":app:bundleRelease"
            output_path="android/app/build/outputs/bundle/release/app-release.aab"
            extension="aab"
          elif [ "$variant" = "debug" ]; then
            task=":app:assembleDebug"
            output_path="android/app/build/outputs/apk/debug/app-debug.apk"
            extension="apk"
          else
            task=":app:assembleRelease"
            output_path="android/app/build/outputs/apk/release/app-release.apk"
            extension="apk"
          fi

          {
            echo "artifact=$artifact"
            echo "variant=$variant"
            echo "task=$task"
            echo "output-path=$output_path"
            echo "extension=$extension"
            echo "signed=$signed"
            echo "abis=$abis"
          } >> "$GITHUB_OUTPUT"

          echo "Profile $BUILD_PROFILE -> $extension ($variant), ABIs: $abis"

      - name: Materialize google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          # app.config.ts only wires FCM when this file exists at the repo root
          # (it is gitignored), so without this step a release build ships with
          # remote push silently disabled.
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json
          echo "Wrote google-services.json ($(wc -c < google-services.json) bytes)."

      - name: Warn when google-services.json is absent
        if: env.HAS_GOOGLE_SERVICES != 'true'
        run: echo "::warning::GOOGLE_SERVICES_JSON is not set. This build ships without FCM config, so remote push will not work."

      - name: Decode the upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kangentic-upload.jks"
          echo "Decoded keystore ($(wc -c < "$RUNNER_TEMP/kangentic-upload.jks") bytes)."

      - name: Generate the native Android project
        # CNG: android/ is produced here and never committed. See
        # .claude/rules/expo-cng.md. --no-install because npm ci already ran.
        run: npx expo prebuild --platform android --no-install

      # Deliberately after prebuild: android/ does not exist at checkout time,
      # so an earlier setup-gradle would have no Gradle files to key its cache
      # on. The cache is per-profile because the ABI set differs.
      #
      # v5 and NOT the latest, for a licensing reason rather than a technical
      # one: v6 moved this action's caching into a proprietary component under
      # Gradle's commercial Terms of Use. Full reasoning at the same `uses:` in
      # e2e.yml. Keep the two workflows on the same major.
      - uses: gradle/actions/setup-gradle@v5

      - name: Read the app version
        id: version
        run: |
          set -euo pipefail
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          read_config_field() {
            node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String($1))" "$RUNNER_TEMP/expo-config.json"
          }
          version_name="$(read_config_field 'c.version')"
          version_code="$(read_config_field 'c.android.versionCode')"
          echo "version-name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building version $version_name (versionCode $version_code)."

      - name: Build with Gradle
        env:
          # Secrets are referenced as shell variables rather than interpolated
          # into the command line, so the rendered run script in the log never
          # contains the values.
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GRADLE_TASK: ${{ steps.plan.outputs.task }}
          BUILD_ABIS: ${{ steps.plan.outputs.abis }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew

          # --parallel: a React Native project is many Gradle modules (one per
          #   autolinked native library), so parallel project execution is a
          #   real win rather than a no-op.
          # --build-cache: setup-gradle caches GRADLE_USER_HOME, which includes
          #   the local build cache, so non-native tasks (Java compile, dex,
          #   resource processing) can hit across runs. Gradle keys cache
          #   entries on task inputs, so this cannot produce a stale artifact.
          gradle_arguments=(
            "$GRADLE_TASK"
            -x lint
            -x test
            --parallel
            --build-cache
            "-PreactNativeArchitectures=$BUILD_ABIS"
          )

          if [ "$HAS_KEYSTORE" = "true" ]; then
            # Injected signing properties override the generated project without
            # touching it, which keeps the CNG rule intact. This mirrors the
            # local recipe in the Android release section of
            # docs/developer-guide.md.
            gradle_arguments+=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/kangentic-upload.jks"
              "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"
            )
          fi

          cd android
          ./gradlew "${gradle_arguments[@]}"

      # A build that goes green while producing an unsigned or debug-signed
      # artifact is the failure mode worth guarding: Play rejects it, but only
      # after a human has spent the upload. Fail here instead.
      - name: Verify the artifact is signed with the upload key
        if: steps.plan.outputs.signed == 'true'
        env:
          OUTPUT_PATH: ${{ steps.plan.outputs.output-path }}
          EXTENSION: ${{ steps.plan.outputs.extension }}
        run: bash .github/scripts/verify-android-signature.sh "$OUTPUT_PATH" "$EXTENSION"

      - name: Verify the artifact carries the expected ABIs
        env:
          OUTPUT_PATH: ${{ steps.plan.outputs.output-path }}
          EXTENSION: ${{ steps.plan.outputs.extension }}
          BUILD_ABIS: ${{ steps.plan.outputs.abis }}
        run: bash .github/scripts/verify-android-abis.sh "$OUTPUT_PATH" "$EXTENSION" "$BUILD_ABIS"

      # The SHIPPING half of the same guard e2e.yml runs. Resource shrinking can
      # drop xterm.html - it is named from the JS bundle, which the shrinker
      # never scans - and the result is a blank Terminal pane, the default view
      # of the session screen, in a build that passed every check and went to
      # Play. Path-agnostic on purpose: optimizeReleaseResources renames the
      # entry, so this matches the bytes rather than a path.
      #
      # RELEASE ONLY, matching the mapping upload below. Not a formality: this
      # job falls back to `assembleDebug` for ANY profile when there is no
      # keystore, and a debug build runs no shrinker at all, so there is nothing
      # to guard and the artifact shape is one this check has never been run
      # against. Verified against a real release APK (run 30506459459) and a real
      # release AAB (run 30466715863); a debug artifact was deliberately left out
      # of scope rather than assumed equivalent.
      - name: Verify the artifact still carries the terminal page
        if: steps.plan.outputs.variant == 'release'
        env:
          OUTPUT_PATH: ${{ steps.plan.outputs.output-path }}
        run: bash .github/scripts/verify-android-assets.sh "$OUTPUT_PATH"

      - name: Name the artifact
        id: name
        env:
          OUTPUT_PATH: ${{ steps.plan.outputs.output-path }}
          EXTENSION: ${{ steps.plan.outputs.extension }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
        run: |
          set -euo pipefail
          artifact_name="kangentic-$BUILD_PROFILE-v$VERSION_NAME-vc$VERSION_CODE-${GITHUB_SHA::7}"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"
          cp "$OUTPUT_PATH" "$RUNNER_TEMP/$artifact_name.$EXTENSION"

      - name: Write the build summary
        env:
          EXTENSION: ${{ steps.plan.outputs.extension }}
          VARIANT: ${{ steps.plan.outputs.variant }}
          SIGNED: ${{ steps.plan.outputs.signed }}
          BUILD_ABIS: ${{ steps.plan.outputs.abis }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
        run: |
          {
            echo "### Android build: \`$BUILD_PROFILE\`"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Artifact | \`$EXTENSION\` ($VARIANT) |"
            echo "| Version | \`$VERSION_NAME\` (code \`$VERSION_CODE\`) |"
            echo "| ABIs | \`$BUILD_ABIS\` |"
            echo "| Signed with upload key | \`$SIGNED\` |"
            echo ""
            echo "Bump \`android.versionCode\` in \`app.config.ts\` before every Play upload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the artifact to the run
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ steps.name.outputs.artifact-name }}.${{ steps.plan.outputs.extension }}
          # ~50 to 140 MB per artifact. The 90-day default accrues storage
          # billing even on a public repository.
          retention-days: 14
          if-no-files-found: error

      # R8 renames the Java/Kotlin layer, and mapping.txt is the only thing that
      # turns a minified frame back into a readable one. The Sentry Gradle plugin
      # uploads it automatically, but only when HAS_SENTRY is true - and Play
      # Console accepts this file for manual deobfuscation regardless. A few
      # hundred KB, so keeping it costs nothing next to the artifact above.
      #
      # Gated on the variant rather than waved through with
      # `if-no-files-found: ignore`, because the two cases are not the same
      # failure. `development` and the keystore-less fallback both build DEBUG
      # (see the plan step), where R8 never runs and no mapping can exist - the
      # condition covers exactly those. A release build that produced no mapping
      # is a real break, and `ignore` would have shipped it silently on the very
      # profiles (`production`, `preview`) where the file matters most.
      #
      # A step output in `if:` needs no env declaration - the signature check
      # above already gates this way - and buildWorkflow.test.ts's env-gating
      # test only constrains `env.*` references, not `steps.*.outputs.*`.
      #
      # KEEP `mapping-` AS A PREFIX. submit-play downloads with
      # `pattern: kangentic-<profile>-*` and `merge-multiple: true`, then passes
      # `artifact/*` straight to the Play upload as `releaseFiles`. A name like
      # `<artifact-name>-mapping` WOULD match that glob, and mapping.txt would be
      # handed to Play as if it were a release binary. The prefix is what keeps
      # the two artifact sets disjoint; it is load-bearing, not cosmetic.
      #
      # `if-no-files-found: ignore` is deliberately kept for now even though the
      # variant gate above already excludes the builds that legitimately have no
      # mapping. Promoting it to `error` is the better check and the intended
      # next step - it would catch a release build that silently produced no
      # mapping - but it should be flipped only once a `production` (AAB,
      # `:app:bundleRelease`) run has confirmed R8 writes to this exact path.
      # Flipping it on an unverified path would redden every release build.
      - name: Upload the R8 mapping file
        if: steps.plan.outputs.variant == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ steps.name.outputs.artifact-name }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
          if-no-files-found: ignore

  # Never runs unless a dispatch explicitly names a track, and even then it
  # waits on the google-play environment's required reviewer. The very first
  # AAB for this package has to be uploaded by hand through the Play Console
  # UI: the Play Developer API only works once an app has at least one release.
  #
  # It re-verifies the downloaded artifact rather than trusting a job output:
  # the artifact on disk is what actually uploads, so the artifact on disk is
  # what gets checked.
  submit-play:
    name: Submit (Google Play)
    needs: build-android
    # `inputs.crash_test != true` is belt-and-braces: the plan job already
    # refuses that combination outright, so this condition should be
    # unreachable. It stays because this is the last gate before a real Play
    # upload, and a skipped submit is a recoverable mistake where a submitted
    # crash-test build is not.
    if: github.event_name == 'workflow_dispatch' && inputs.submit_track != 'none' && inputs.crash_test != true
    runs-on: ubuntu-latest
    environment: google-play
    # Narrower than it looks: the workflow is `contents: read` at the top level,
    # and this raises it for THIS job only, so the tag-the-spent-version-code
    # step can create a ref. The build jobs stay read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Same composite as the build job. This one needs node_modules for the
      # `npx expo config` below, not merely a Node binary.
      - uses: ./.github/actions/setup-node-deps

      - name: Download the built artifact
        uses: actions/download-artifact@v8
        with:
          pattern: kangentic-${{ inputs.profile }}-*
          merge-multiple: true
          path: artifact

      - name: Verify the artifact is signed with the upload key
        run: |
          set -euo pipefail
          file="$(ls artifact/* | head -n 1)"
          echo "Submitting $file"
          bash .github/scripts/verify-android-signature.sh "$file" "${file##*.}"

      # Re-checked here even though the plan job already preflighted it. Not
      # redundant: this closes the window between the plan job and now, in which
      # a release cut from another machine could have taken the number.
      - name: Check the version code is free on every track
        id: version
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          version_code="$(node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String(c.android.versionCode))" "$RUNNER_TEMP/expo-config.json")"
          version_name="$(node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String(c.version))" "$RUNNER_TEMP/expo-config.json")"
          echo "version-code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version-name=$version_name" >> "$GITHUB_OUTPUT"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play-service-account.json"
          node scripts/checkPlayVersionCode.mjs --key "$RUNNER_TEMP/play-service-account.json" --package com.kangentic.mobile --version-code "$version_code"

      # A staged rollout and a full release are different Play API calls, not one
      # call with an extra field: `userFraction` is only valid with an inProgress
      # status, and Play rejects it outright alongside `completed`. So the two are
      # separate steps rather than one step with interpolated values, which would
      # be a silent misconfiguration waiting to happen.
      - name: Upload to Google Play (staged rollout)
        if: inputs.rollout != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kangentic.mobile
          releaseFiles: artifact/*
          track: ${{ inputs.submit_track }}
          status: inProgress
          userFraction: ${{ inputs.rollout }}

      - name: Upload to Google Play (full release)
        if: inputs.rollout == ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kangentic.mobile
          releaseFiles: artifact/*
          track: ${{ inputs.submit_track }}
          status: completed

      # The durable record that this version code is now spent.
      #
      # Until now the only place that knowledge lived was a hand-edited comment
      # in app.config.ts, which is true when written and rots silently. That is
      # not hypothetical: a stale "builds 1 and 2 are spent, hence 3" note sent
      # the 2026-07-28 iOS release at a build number Apple had already taken.
      # A tag cannot drift, and it is queryable (`git tag --list 'android-vc*'`)
      # by a human or by /release, unlike prose.
      #
      # Created only after the upload step succeeds, so a tag means the bytes
      # actually reached Play, not that a job was dispatched. Failure to tag
      # must not fail the release: the upload has already happened and is not
      # undoable, so a tagging problem is a bookkeeping problem.
      - name: Record the spent version code as a tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ steps.version.outputs.version-code }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
        run: |
          set -euo pipefail
          tag="android-vc${VERSION_CODE}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists, leaving it alone."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}" >/dev/null
          echo "Tagged ${GITHUB_SHA} as ${tag} (v${VERSION_NAME}, track ${{ inputs.submit_track }})."

      - name: Write the submit summary
        if: always()
        run: |
          {
            echo "### Google Play upload"
            echo ""
            echo "Track: \`${{ inputs.submit_track }}\`"
            if [ -n "${{ inputs.rollout }}" ]; then
              echo "Staged rollout to \`${{ inputs.rollout }}\` of users, status \`inProgress\`."
              echo ""
              echo "**A staged rollout is not finished.** Increase the fraction or complete it in the"
              echo "Play Console, or it stays partial indefinitely. To pull it, use Halt rollout there."
            else
              echo "Full release, status \`completed\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
