name: Build iOS

# Two independent paths, both on free unmetered macOS runners (standard runners
# are free on public repositories), and neither spends an EAS cloud build:
#
#   simulator - unsigned compile check. No Apple account, no certificates, no
#               secrets. Cheap enough to run on any change.
#   device    - signed .ipa for TestFlight and the App Store, archived and
#               exported with xcodebuild and uploaded straight to Apple.
#
# The device path exists for the same reason build-android.yml does: EAS Free
# gives 15 iOS cloud builds a month at concurrency 1 in a low-priority queue,
# which can mean hours of wait, and that allowance is Expo's to change. A
# GitHub runner has neither cap nor queue.
#
# It also removes Expo from the submission path entirely. `eas submit` uploads
# through Expo's own servers; the steps here talk to Apple directly, so an EAS
# Submit outage cannot block a release. See the iOS release section of
# docs/developer-guide.md.
#
# Dispatch only, deliberately. A native iOS build is 20 to 40 minutes, which is
# far too slow for a PR gate; ci.yml stays the gate.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'simulator = unsigned compile check. device = signed .ipa.'
        type: choice
        default: simulator
        options:
          - simulator
          - device
          - both
      submit:
        description: 'Upload the signed .ipa to App Store Connect (device builds only).'
        type: choice
        default: none
        options:
          - none
          - testflight
      maestro:
        description: 'Run a Maestro flow against the simulator. EXPERIMENTAL, see the job comment.'
        type: choice
        default: none
        options:
          - none
          - smoke
  # Weekly drift detection. Nothing here is PR-triggered, so without a schedule the
  # only way to learn that a runner Xcode bump, a dependency update, or an Apple
  # toolchain change broke the iOS build is to want a release and discover it then.
  # Monday 06:00 UTC picks up whatever landed over the weekend.
  #
  # WEEKLY, not nightly, and that was considered. The drift this catches is
  # toolchain drift, and GitHub's runner images roll roughly weekly, so a nightly
  # cadence would spend seven 30-minute macOS jobs to observe the same change
  # once. Breakage from our OWN code has a different net: /pull-request dispatches
  # this workflow whenever a diff touches native inputs, so it is caught the same
  # day without the cron.
  #
  # Simulator only: see the job conditions below, which are written so a cron run
  # cannot fire a signed device build or an upload.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: build-ios-${{ github.ref }}-${{ github.event.inputs.target || 'scheduled' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # An unsigned iOS simulator build. Its purpose is not distribution: it proves
  # the native tree compiles at all, which for a long time was unverified here.
  # Kept as its own job rather than a matrix dimension of the signed build, so
  # the cheap always-available check cannot be taken down by a signing problem.
  simulator:
    name: Simulator (unsigned compile check)
    # `inputs` are all empty on a schedule, so the conditions must name the event
    # rather than lean on input defaults. Left implicit, `inputs.target != 'device'`
    # AND `inputs.target != 'simulator'` are BOTH true on a cron run, which would
    # quietly fire a signed device build every Monday.
    if: github.event_name == 'schedule' || inputs.target != 'device'
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Generate the native iOS project
        # CNG: ios/ is produced here and never committed. See
        # .claude/rules/expo-cng.md. --no-install because setup-node-deps
        # already installed; it also skips CocoaPods, which the next step runs.
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        # The .xcworkspace is a CocoaPods artifact, so it does not exist until
        # this step completes. Everything that reads the workspace comes after.
        working-directory: ios
        run: pod install

      - name: Resolve the workspace and scheme
        id: xcode
        run: bash .github/scripts/resolve-ios-scheme.sh

      - name: Build for the simulator
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # xcodebuild exits 0 for a build that compiled nothing we care about, so
      # the exit code is not proof. The app bundle existing is. This is not
      # hypothetical: the first version of this job "succeeded" in three minutes
      # while building a CocoaPods scheme and no app code at all.
      - name: Verify an app bundle was produced
        id: verify
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/$SCHEME.app"
          if [ ! -d "$app_path" ]; then
            echo "::error::No $SCHEME.app was produced. The build compiled something, but not the app."
            ls -R "$RUNNER_TEMP/DerivedData/Build/Products" || true
            exit 1
          fi
          if [ ! -f "$app_path/$SCHEME" ]; then
            echo "::error::$SCHEME.app contains no executable."
            exit 1
          fi
          echo "Produced $SCHEME.app ($(du -sh "$app_path" | cut -f1))."
          echo "app-path=$app_path" >> "$GITHUB_OUTPUT"

      # Compiling is not running. Until this step existed the iOS app had never
      # been launched anywhere, so a missing Info.plist key, a native module that
      # throws in its constructor, or a JS bundle that dies on first render would
      # all have passed the build unnoticed.
      - name: Launch the app on a simulator
        id: smoke
        env:
          APP_PATH: ${{ steps.verify.outputs.app-path }}
          # Keeps the simulator up for the Maestro step below, which drives the
          # same one. Booting a simulator takes over a minute.
          KEEP_SIMULATOR_BOOTED: ${{ inputs.maestro != 'none' && '1' || '' }}
        run: bash .github/scripts/smoke-ios-simulator.sh "$APP_PATH" com.kangentic.mobile "$RUNNER_TEMP/launch.png"

      # EXPERIMENTAL, and opt-in for a reason. Maestro's iOS driver needs Facebook's
      # idb_companion, and there is an open upstream issue where a recent
      # macOS + Xcode pairing breaks its simulator connection entirely
      # (mobile-dev-inc/Maestro#2906). This runner is on Xcode 26.5, so it may
      # simply not work.
      #
      # Gated behind an input rather than folded into the default path: the launch
      # smoke above is now a proven, reliable signal, and an experiment with a known
      # upstream failure mode must not be able to take it down. Promote this to
      # default only once it has been green repeatedly.
      #
      # Worth knowing what this can and cannot reach. `.maestro/smoke.yaml` runs
      # against a fresh unpaired install, so it exercises real UI interaction on iOS
      # (tap handling, tab navigation, empty states) but NOT the terminal. The
      # terminal needs a paired session, which needs the stub desktop peer and the
      # `usesCleartextTraffic` carve-out that is still unlanded.
      - name: Install Maestro and its iOS driver
        if: inputs.maestro != 'none'
        run: |
          set -euo pipefail
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          curl -Ls 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run the Maestro smoke flow
        if: inputs.maestro != 'none'
        env:
          MAESTRO_DEVICE: ${{ steps.smoke.outputs.device-id }}
        run: |
          set -euo pipefail
          maestro --version
          maestro --device "$MAESTRO_DEVICE" test .maestro/smoke.yaml \
            --format JUNIT \
            --output "$RUNNER_TEMP/maestro-ios-report.xml" \
            --debug-output "$RUNNER_TEMP/maestro-ios-debug" \
            --flatten-debug-output

      - name: Upload the Maestro output
        if: always() && inputs.maestro != 'none'
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-${{ github.sha }}
          path: |
            ${{ runner.temp }}/maestro-ios-report.xml
            ${{ runner.temp }}/maestro-ios-debug
          retention-days: 14
          if-no-files-found: warn

      # Uploaded even on failure: a screenshot of a blank or red screen is the
      # single most useful artifact when a launch goes wrong, and a process can be
      # alive while rendering nothing at all.
      - name: Upload the launch screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-launch-${{ github.sha }}
          path: ${{ runner.temp }}/launch.png
          retention-days: 14
          if-no-files-found: warn

      - name: Write the build summary
        if: always()
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          {
            echo "### iOS simulator build and launch"
            echo ""
            echo "App scheme: \`${SCHEME:-unresolved}\`"
            echo ""
            echo "Unsigned simulator build, so it is not installable on a device and not a"
            echo "distribution artifact. It IS launched on a simulator, and the run's"
            echo "\`ios-simulator-launch-*\` artifact holds a screenshot of what rendered."
          } >> "$GITHUB_STEP_SUMMARY"

  device:
    name: Device (signed .ipa)
    if: github.event_name != 'schedule' && inputs.target != 'simulator'
    runs-on: macos-latest
    timeout-minutes: 90
    outputs:
      artifact-name: ${{ steps.name.outputs.artifact-name }}
      bundle-id: ${{ steps.signing.outputs.bundle-id }}
      build-number: ${{ steps.version.outputs.build-number }}
      # Exposed for the spent-build-number tag in submit-testflight. The step
      # already computed it for the ASC preflight; it just was not published.
      version-name: ${{ steps.version.outputs.version-name }}
    env:
      # Secrets cannot be referenced from an `if:` condition, so presence is
      # resolved once here as a plain boolean and the steps branch on that.
      HAS_SIGNING: ${{ secrets.IOS_DIST_CERT_BASE64 != '' && secrets.IOS_PROVISIONING_PROFILE_BASE64 != '' }}
      # Two upload auth paths, deliberately. An App Store Connect API key is the
      # better one, but minting it requires App Store Connect's Users and Access
      # page to be up, and that is exactly the surface that fails during an ASC
      # incident. An app-specific password comes from appleid.apple.com, a
      # different service, so it stays available when ASC does not.
      HAS_ASC_API_KEY: ${{ secrets.ASC_API_KEY_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
      # DSN is a repository VARIABLE, not a secret: it ships in the public app
      # bundle, and a variable can be read back to confirm which project a
      # build reports to. Same rationale as build-android.yml.
      HAS_SENTRY: ${{ secrets.SENTRY_AUTH_TOKEN != '' && vars.SENTRY_DSN != '' }}

    steps:
      - uses: actions/checkout@v7

      # Fails immediately rather than degrading. The Android job can fall back
      # to a debug-signed APK because that is still installable and still proves
      # the toolchain; there is no equivalent useful unsigned iOS artifact, and
      # the simulator job above already covers "does it compile".
      - name: Require signing material
        if: env.HAS_SIGNING != 'true'
        run: |
          echo "::error::A device build needs IOS_DIST_CERT_BASE64, IOS_DIST_CERT_PASSWORD and IOS_PROVISIONING_PROFILE_BASE64."
          echo "::error::See the credential inventory in docs/developer-guide.md. Dispatch with target=simulator for an unsigned check."
          exit 1

      - name: Set up Node and dependencies
        uses: ./.github/actions/setup-node-deps

      - name: Install the signing certificate and provisioning profile
        id: signing
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$IOS_DIST_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/dist-cert.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          bash .github/scripts/install-ios-signing.sh \
            "$RUNNER_TEMP/dist-cert.p12" \
            "$IOS_DIST_CERT_PASSWORD" \
            "$RUNNER_TEMP/profile.mobileprovision"

      # eas.json stays the source of truth for per-profile env on BOTH platforms.
      # Without this, an EXPO_PUBLIC_* value added to a profile would reach an
      # Android build and silently not reach an iOS one, which is the kind of
      # divergence nobody notices until a feature flag is mysteriously off on one
      # platform. iOS has no profile input yet (see the parity notes in
      # docs/developer-guide.md), so it takes production's env, which is what a
      # signed distribution build should carry.
      - name: Export the profile env from eas.json
        run: node scripts/easProfile.mjs production --github-env

      # plugins/withIosManualSigning.ts reads these and applies manual signing to
      # the app target only. It MUST run before prebuild, not merely before the
      # archive: a config plugin executes during prebuild, and GITHUB_ENV only
      # affects later steps, so exporting late leaves the generated project on
      # automatic signing and the archive fails with no obvious cause. Same trap
      # as the eas.json env export in build-android.yml, which a test locks.
      - name: Export the signing inputs for the config plugin
        env:
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile-uuid }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing-identity }}
        run: |
          set -euo pipefail
          {
            echo "KANGENTIC_IOS_TEAM_ID=$TEAM_ID"
            echo "KANGENTIC_IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "KANGENTIC_IOS_SIGNING_IDENTITY=$SIGNING_IDENTITY"
          } >> "$GITHUB_ENV"

      # Same pre-prebuild requirement, and the same reason it is a secret
      # rather than an eas.json entry, as build-android.yml: app.config.ts
      # reads SENTRY_AUTH_TOKEN at config-evaluation time to decide whether
      # to add the Sentry plugin, and a DSN committed to a public repo would
      # route every fork's crashes into this project's free-tier quota.
      - name: Export the Sentry build env
        if: env.HAS_SENTRY == 'true'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
        run: |
          set -euo pipefail
          # Token masked (it can upload releases); DSN deliberately not, since
          # it ships in the published bundle and a legible value makes this log
          # answer "which project did this build report to?".
          echo "::add-mask::$SENTRY_AUTH_TOKEN"
          {
            echo "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN"
            echo "EXPO_PUBLIC_SENTRY_DSN=$SENTRY_DSN"
          } >> "$GITHUB_ENV"
          echo "Sentry is enabled for this build: dSYMs and source maps upload, crash reporting is active."
          echo "Reporting to: $SENTRY_DSN"

      - name: Note when Sentry is not configured
        if: env.HAS_SENTRY != 'true'
        run: echo "::notice::SENTRY_AUTH_TOKEN/SENTRY_DSN are not both set. This build ships with crash reporting inert and uploads no symbols."

      - name: Generate the native iOS project
        run: npx expo prebuild --platform ios --no-install

      # Keyed on the Podfile.lock that prebuild just generated, so the cache is
      # only reused when the resolved pod set is byte-identical. pod install on
      # an Expo project is minutes of downloads.
      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: ${{ runner.os }}-pods-

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Resolve the workspace and scheme
        id: xcode
        run: bash .github/scripts/resolve-ios-scheme.sh

      - name: Read the app version
        id: version
        run: |
          set -euo pipefail
          npx expo config --json > "$RUNNER_TEMP/expo-config.json"
          read_config_field() {
            node -e "const c=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.stdout.write(String($1))" "$RUNNER_TEMP/expo-config.json"
          }
          echo "version-name=$(read_config_field 'c.version')" >> "$GITHUB_OUTPUT"
          echo "build-number=$(read_config_field 'c.ios.buildNumber')" >> "$GITHUB_OUTPUT"

      # Runs before the archive so a duplicate build number costs seconds rather
      # than a 30 minute build followed by an App Store Connect rejection. This
      # is the iOS half of the lesson scripts/checkPlayVersionCode.mjs encodes.
      - name: Check the build number is free on App Store Connect
        if: env.HAS_ASC_API_KEY == 'true'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle-id }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc-api-key.p8"
          node scripts/checkAppStoreBuild.mjs \
            --key "$RUNNER_TEMP/asc-api-key.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$BUNDLE_ID" \
            --version "$VERSION_NAME" \
            --build-number "$BUILD_NUMBER"

      - name: Warn when the build number cannot be preflighted
        if: env.HAS_ASC_API_KEY != 'true'
        run: echo "::warning::No App Store Connect API key, so ios.buildNumber was not checked against existing builds. A duplicate will be rejected at upload."

      # Guard: the config plugin is inert without its environment variables, and a
      # silently unsigned archive is exactly the failure this whole workflow is
      # built to avoid. Cheap to assert, and it names the cause.
      - name: Verify the app target carries manual signing
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile-uuid }}
        run: |
          set -euo pipefail
          settings_path="$RUNNER_TEMP/app-target-settings.txt"
          xcodebuild -showBuildSettings \
            -workspace "ios/$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release > "$settings_path"

          if ! grep -q "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_UUID" "$settings_path"; then
            echo "::error::The app target is not set to the installed provisioning profile."
            echo "::error::plugins/withIosManualSigning.ts did not apply. Its KANGENTIC_IOS_* variables must be exported BEFORE prebuild."
            grep -E "CODE_SIGN_STYLE|PROVISIONING_PROFILE_SPECIFIER|DEVELOPMENT_TEAM" "$settings_path" || true
            exit 1
          fi
          if ! grep -q "CODE_SIGN_STYLE = Manual" "$settings_path"; then
            echo "::error::The app target is still on automatic signing."
            exit 1
          fi
          echo "App target is on manual signing with the installed profile."

      - name: Archive the app (xcodebuild)
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          KEYCHAIN_PATH: ${{ steps.signing.outputs.keychain-path }}
        run: |
          set -euo pipefail

          # Signed here rather than only at export time. Exporting an unsigned
          # archive is the usual way to dodge the "target does not support
          # provisioning profiles" error these command-line settings can cause
          # on Pods targets, but an unsigned archive carries no
          # archived-expanded-entitlements.xcent, so the re-sign at export can
          # silently drop custom entitlements. This app needs
          # aps-environment=production for push, and losing it produces a build
          # that installs, launches, and never receives a notification. A loud
          # archive failure is a far better trade than a silent one, and
          # verify-ios-signature.sh checks the entitlement either way.
          #
          # No signing settings on the command line. They would apply to every
          # target in the workspace, and a target that produces no signed bundle
          # rejects a provisioning profile outright. The first attempt failed
          # exactly there, on a Swift Package target:
          #
          #   RaTeX_RaTeX does not support provisioning profiles, but
          #   provisioning profile <uuid> has been manually specified.
          #
          # plugins/withIosManualSigning.ts now writes the four properties into
          # the app target's build settings during prebuild instead. Exempting
          # each offending target by name would be whack-a-mole: the dependency
          # graph decides how many exist.
          #
          # OTHER_CODE_SIGN_FLAGS stays here because pointing codesign at the
          # throwaway keychain is harmless for targets that never sign.
          #
          # If a "does not support provisioning profiles" error returns, the
          # cause is a target the plugin did not cover. Once the Notification
          # Service Extension lands it will need its own profile, added both to
          # the plugin and to the provisioningProfiles dict in
          # .github/scripts/export-ios-ipa.sh. Do not "fix" it by archiving
          # unsigned: an unsigned archive can silently lose aps-environment at
          # export, which ships an app that never receives a push.
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH"

      - name: Export the .ipa
        id: export
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
          TEAM_ID: ${{ steps.signing.outputs.team-id }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile-uuid }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle-id }}
          SIGNING_IDENTITY: ${{ steps.signing.outputs.signing-identity }}
        run: bash .github/scripts/export-ios-ipa.sh

      # An .ipa that is unsigned, development-signed, or missing the push
      # entitlement is indistinguishable from a good one until Apple rejects it
      # or a tester reports silence. Checked here, before the upload.
      - name: Verify the .ipa is distribution signed
        env:
          IPA_PATH: ${{ steps.export.outputs.ipa-path }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle-id }}
        run: bash .github/scripts/verify-ios-signature.sh "$IPA_PATH" "$BUNDLE_ID"

      - name: Name the artifact
        id: name
        env:
          IPA_PATH: ${{ steps.export.outputs.ipa-path }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
        run: |
          set -euo pipefail
          artifact_name="kangentic-ios-v$VERSION_NAME-b$BUILD_NUMBER-${GITHUB_SHA::7}"
          cp "$IPA_PATH" "$RUNNER_TEMP/$artifact_name.ipa"
          echo "artifact-name=$artifact_name" >> "$GITHUB_OUTPUT"

      # The .ipa is stored before anything tries to upload it, so an Apple-side
      # failure leaves a verified artifact that can be retried by re-running the
      # submit job alone. That is not a hypothetical: the first attempt to submit
      # this app hit an App Store Connect outage.
      - name: Upload the .ipa as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.artifact-name }}
          path: ${{ runner.temp }}/${{ steps.name.outputs.artifact-name }}.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Write the build summary
        if: always()
        env:
          ARTIFACT_NAME: ${{ steps.name.outputs.artifact-name }}
          VERSION_NAME: ${{ steps.version.outputs.version-name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
          BUNDLE_ID: ${{ steps.signing.outputs.bundle-id }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          {
            echo "### iOS device build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Artifact | \`${ARTIFACT_NAME:-none}\` |"
            echo "| Bundle id | \`${BUNDLE_ID:-unresolved}\` |"
            echo "| Version | \`${VERSION_NAME:-?}\` (build \`${BUILD_NUMBER:-?}\`) |"
            echo "| Requested upload | \`$SUBMIT\` |"
            echo ""
            echo "Bump \`ios.buildNumber\` in \`app.config.ts\` before every App Store Connect upload."
          } >> "$GITHUB_STEP_SUMMARY"

  # Its own job, behind the app-store-connect GitHub Environment's required
  # reviewer, for the same reasons as build-android.yml's submit-play job: an
  # upload reaches people outside this machine, and it should take a deliberate
  # human approval rather than a dispatch input alone.
  #
  # Splitting it also makes an Apple outage cheap. Re-running this one job
  # retries the upload against the already-verified .ipa, with no rebuild and no
  # new build number. That is exactly the situation this workflow was written in.
  #
  # macOS because `xcrun altool` is the uploader. It re-verifies what it
  # downloaded rather than trusting the build job, which is both stronger and
  # what caught a bad Android artifact twice.
  submit-testflight:
    name: Submit (TestFlight)
    needs: device
    if: github.event_name != 'schedule' && inputs.submit == 'testflight'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: app-store-connect
    # The workflow is `contents: read` at the top level. Raised for THIS job
    # only, so the spent-build-number tag step can create a ref. The archive
    # job stays read-only.
    permissions:
      contents: write
    env:
      # Declared HERE and not only on the `device` job. `env` does not cross a job
      # boundary, and the first version of this workflow assumed it did: the
      # "Wait for Apple to accept the build" step is gated on this, so it silently
      # SKIPPED on every run while the job still reported success. That is the
      # precise failure this whole job exists to prevent, reintroduced one level up
      # by a scoping mistake. tests/unit/buildWorkflow.test.ts now checks that every
      # job gating a step on an env boolean also defines it.
      HAS_ASC_API_KEY: ${{ secrets.ASC_API_KEY_BASE64 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Download the verified .ipa from the build job
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.device.outputs.artifact-name }}
          path: artifact

      - name: Verify the .ipa is distribution signed
        env:
          BUNDLE_ID: ${{ needs.device.outputs.bundle-id }}
        run: |
          set -euo pipefail
          ipa_path="$(find artifact -maxdepth 1 -name '*.ipa' | head -n 1)"
          if [ -z "$ipa_path" ]; then
            echo "::error::No .ipa in the downloaded artifact."
            exit 1
          fi
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"
          bash .github/scripts/verify-ios-signature.sh "$ipa_path" "$BUNDLE_ID"

      - name: Upload to App Store Connect
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash .github/scripts/upload-ios-testflight.sh "$IPA_PATH"

      # An upload succeeding is NOT a build reaching TestFlight. Builds 1 and 2 were
      # both refused by Apple AFTER `UPLOAD SUCCEEDED`, with ITMS-90683 for a missing
      # purpose string, and the only notification was an email: altool reported
      # success, `--validate-app` had passed, and this job went green over a rejected
      # binary. This step closes that gap by waiting for the state Apple actually
      # lands on.
      #
      # Skipped without an ASC API key, since it needs the API to ask.
      - name: Wait for Apple to accept the build
        if: env.HAS_ASC_API_KEY == 'true'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: ${{ needs.device.outputs.bundle-id }}
          BUILD_NUMBER: ${{ needs.device.outputs.build-number }}
        run: |
          set -euo pipefail
          printf '%s' "$ASC_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/asc-api-key.p8"
          node scripts/checkAppStoreBuild.mjs \
            --key "$RUNNER_TEMP/asc-api-key.p8" \
            --key-id "$ASC_KEY_ID" \
            --issuer-id "$ASC_ISSUER_ID" \
            --bundle-id "$BUNDLE_ID" \
            --build-number "$BUILD_NUMBER" \
            --await-processing 1 \
            --timeout-minutes 25

      - name: Warn that Apple's verdict was not checked
        if: env.HAS_ASC_API_KEY != 'true'
        run: echo "::warning::No App Store Connect API key, so Apple's processing verdict was not checked. An upload can still be rejected afterwards, by email only."

      # The durable record that this build number is now spent. See the matching
      # step in build-android.yml for the reasoning; the short version is that
      # this knowledge previously lived only in a hand-edited comment in
      # app.config.ts, and a stale one sent the 2026-07-28 release at a build
      # number Apple had already taken.
      #
      # Deliberately placed AFTER the accept-verdict step, so on a run with an
      # ASC key the tag means Apple accepted the build, not merely that altool
      # said UPLOAD SUCCEEDED. Builds 1 and 2 are exactly why that distinction
      # matters: both uploaded fine and were then refused.
      #
      # Never fails the job. The upload is already done and cannot be undone, so
      # a tagging problem is bookkeeping, not a release failure.
      - name: Record the spent build number as a tag
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ needs.device.outputs.build-number }}
          VERSION_NAME: ${{ needs.device.outputs.version-name }}
        run: |
          set -euo pipefail
          tag="ios-b${BUILD_NUMBER}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists, leaving it alone."
            exit 0
          fi
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" \
            -f sha="${GITHUB_SHA}" >/dev/null
          echo "Tagged ${GITHUB_SHA} as ${tag} (v${VERSION_NAME})."

      - name: Write the submit summary
        if: always()
        env:
          BUNDLE_ID: ${{ needs.device.outputs.bundle-id }}
          BUILD_NUMBER: ${{ needs.device.outputs.build-number }}
        run: |
          {
            echo "### App Store Connect upload"
            echo ""
            echo "Uploaded \`$BUNDLE_ID\` build \`$BUILD_NUMBER\`."
            echo ""
            echo "It appears in TestFlight once Apple finishes processing, usually 5 to 30 minutes."
            echo "If this job failed, re-run it: the verified .ipa is attached to this run, so no rebuild is needed."
          } >> "$GITHUB_STEP_SUMMARY"
