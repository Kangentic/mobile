name: Build iOS (simulator compile check)

# An unsigned iOS simulator build. It needs no Apple Developer Program
# membership, no certificates, and no secrets, and macOS standard runners are
# free and unmetered on public repositories, so this costs nothing.
#
# Its purpose is not distribution. This app has never been compiled for iOS at
# all, so the native tree (the WKWebView terminal, the notification plugin set,
# the New Architecture dependency graph) is entirely unverified. A red run here
# is a useful result.
#
# Dispatch only. Once it is reliably green, a weekly schedule is a cheap way to
# catch drift.

on:
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the native iOS project
        # CNG: ios/ is produced here and never committed. See
        # .claude/rules/expo-cng.md. --no-install because npm ci already ran;
        # it also skips CocoaPods, which the next step runs explicitly.
        run: npx expo prebuild --platform ios --no-install

      - name: Install pods
        # The .xcworkspace is a CocoaPods artifact, so it does not exist until
        # this step completes. Everything that reads the workspace comes after.
        working-directory: ios
        run: pod install

      - name: Resolve the workspace and scheme
        id: xcode
        run: |
          set -euo pipefail
          workspace="$(ls -d ios/*.xcworkspace | head -n 1)"
          # The app scheme is named after the workspace, which expo prebuild
          # names after the project. Never take schemes[0]: that list is
          # alphabetical and full of Pod schemes, so it silently picks
          # something like EXApplication and "succeeds" without compiling any
          # app code.
          scheme="$(basename "$workspace" .xcworkspace)"

          xcodebuild -list -json -workspace "$workspace" > "$RUNNER_TEMP/schemes.json"
          if ! node -e "const w=JSON.parse(require('node:fs').readFileSync(process.argv[1],'utf8'));process.exit(w.workspace.schemes.includes(process.argv[2])?0:1)" "$RUNNER_TEMP/schemes.json" "$scheme"; then
            echo "::error::Scheme \"$scheme\" is not in $workspace. Available schemes are in the log below."
            cat "$RUNNER_TEMP/schemes.json"
            exit 1
          fi

          echo "workspace=$workspace" >> "$GITHUB_OUTPUT"
          echo "scheme=$scheme" >> "$GITHUB_OUTPUT"
          echo "Building app scheme \"$scheme\" from $workspace."

      - name: Build for the simulator
        env:
          WORKSPACE: ${{ steps.xcode.outputs.workspace }}
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      # xcodebuild exits 0 for a build that compiled nothing we care about, so
      # the exit code is not proof. The app bundle existing is.
      - name: Verify an app bundle was produced
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/$SCHEME.app"
          if [ ! -d "$app_path" ]; then
            echo "::error::No $SCHEME.app was produced. The build compiled something, but not the app."
            ls -R "$RUNNER_TEMP/DerivedData/Build/Products" || true
            exit 1
          fi
          if [ ! -f "$app_path/$SCHEME" ]; then
            echo "::error::$SCHEME.app contains no executable."
            exit 1
          fi
          echo "Produced $SCHEME.app ($(du -sh "$app_path" | cut -f1))."

      - name: Write the build summary
        if: always()
        env:
          SCHEME: ${{ steps.xcode.outputs.scheme }}
        run: |
          {
            echo "### iOS simulator compile check"
            echo ""
            echo "App scheme: \`${SCHEME:-unresolved}\`"
            echo ""
            echo "Unsigned simulator build. Not installable on a device and not a distribution artifact."
          } >> "$GITHUB_STEP_SUMMARY"
