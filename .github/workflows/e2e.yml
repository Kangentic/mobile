name: Emulator

# Maestro E2E against a real APK on an Android emulator, as a PR gate. The point
# is that main stays stable because E2E is a merge requirement, which then lets
# releases be cut from main at will without worrying about E2E timing. Release
# builds stay in build-android.yml and never gate a PR.
#
# TWO SUITES, TWO DIFFERENT JOBS ON PURPOSE
#
# .maestro/smoke.yaml runs against a fresh, unpaired install: no relay, no
# pairing, nothing external. It is the `maestro` job below, and it is what the
# required `E2E Tests (Maestro)` check actually gates on.
#
# The 11 flows under .maestro/paired/ run in the `maestro-paired` job: it
# checks out the public Kangentic/relay repo, runs it locally on the runner,
# pairs the app to scripts/stubDesktopPeer.mjs over it (both already used by
# the local dev rig, see .claude/skills/e2e/SKILL.md), then runs the suite.
# The usesCleartextTraffic carve-out this depends on (app.config.ts, gated on
# EXPO_PUBLIC_KANGENTIC_E2E) is on main.
#
# `maestro-paired` is deliberately advisory: it reports as its own check but
# is NOT in the `e2e` gate's `needs:` below, so a red run does not block a
# merge. A required check that cannot pass blocks every merge, which is
# exactly why only smoke was wired into the gate before this suite had any CI
# runs to prove it stable. Nothing in its NAME says advisory, because GitHub
# already prints a "Required" badge on the checks that are, so the absence of
# one is the honest signal and the name does not have to be rewritten on
# promotion. Promoting it is then a two-line change: add it to the gate's
# `needs:` and fold its result into the gate condition (plus deleting the
# assertion in tests/unit/ciSafeMaestroFlows.test.ts that pins it out). The
# criteria for earning that - 10 consecutive green runs across 5+ PRs, no
# re-runs - are in docs/developer-guide.md.
#
# WHEN THE EXPENSIVE JOBS DO NOT RUN
#
# The `changes` job skips them for a diff that cannot change the APK (docs,
# .claude/, tests/ - reported as `no-app-change`) and for a DRAFT pull request,
# and the gate treats a legitimate skip as a pass while naming which skip it
# was. Draft is safe because GitHub refuses to merge a draft, so nothing can
# land on that result; marking the PR ready re-fires this workflow (hence
# `ready_for_review` in the trigger types) and pays for the suites once,
# before the merge that needs them.
#
# The gate FAILS CLOSED if the classifier itself did not succeed. It used to
# fail open: `run-e2e` is a job output, so it is empty whenever `changes` did
# not finish, and the skip branch's `!= "true"` accepted that, making this
# REQUIRED check exit 0 green having built and run nothing.
# tests/unit/e2eGate.test.ts executes the gate script against every one of
# those states so it cannot regress.

on:
  pull_request:
    branches: [main]
    # `ready_for_review` is NOT in the default set
    # (opened, synchronize, reopened), and the `changes` job below skips the
    # suites while a PR is a draft. Without this type the workflow would never
    # re-fire when the PR is marked ready, so the skipped-because-draft result
    # would stand as the final answer on a PR that is now asking to merge.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # PIN THE E2E RUNNER ITSELF. `curl -Ls https://get.maestro.mobile.dev` fetches
  # `releases/latest` when this is unset, so before it existed every run installed
  # whatever Maestro had shipped that morning, and a Maestro release could turn
  # the REQUIRED `E2E Tests (Maestro)` check red overnight with no commit in this
  # repository. That is the same hazard the relay checkout below is pinned to a
  # SHA to avoid, arriving through the tool instead of a sibling repo.
  #
  # The installer reads this from the environment and resolves
  # `releases/download/cli-$MAESTRO_VERSION/maestro.zip`, so the value is a bare
  # version and the `cli-` prefix is the installer's. Verified against the real
  # tag before pinning, because `maestro --version` prints `2.7.0` while the tag
  # is `cli-2.7.0`, and a pin that 404s would have converted this fix into the
  # outage it exists to prevent.
  #
  # Declared once at WORKFLOW level rather than twice at step level: both the
  # smoke and paired jobs install Maestro, and two literals are two things to
  # bump. tests/unit/ciSafeMaestroFlows.test.ts asserts this is set, that no job
  # shadows it, and that it matches the version .claude/rules/e2e-maestro-runs.md
  # tells a developer to run locally - a local CLI ahead of CI is how a flow
  # passes on a laptop and fails the gate.
  #
  # Bump deliberately: read Maestro's release notes, run both suites, then move
  # this line and the rule's in the same commit.
  MAESTRO_VERSION: '2.7.0'
  # No telemetry from CI. Maestro phones home on every invocation unless this is
  # set, which is 13 calls per paired run, and the runner has nothing to say that
  # this project wants said on its behalf. It also silences the notice that the
  # version guard below would otherwise have to parse around.
  MAESTRO_CLI_NO_ANALYTICS: '1'

concurrency:
  group: e2e-${{ github.ref }}
  # Cancel superseded PR runs, NEVER a run on main. The push-to-main run is the
  # only one that WRITES the Gradle build cache: gradle/actions/setup-gradle
  # restores everywhere but saves only on the default branch, which is where the
  # "415 from cache" tasks in every PR's Gradle build come from. With a blanket
  # `true`, two merges landing close together cancelled the first main run
  # mid-build, so the cache it was about to write never landed and the next PR
  # paid for it. A main run is also the last unconditional proof the suites pass
  # on the merged result.
  #
  # `push` and `workflow_dispatch` runs use a different `github.ref` from a PR's
  # `refs/pull/N/merge`, so they were never contending with PR runs anyway - the
  # cancellation this stops is main-versus-main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the expensive jobs need to run at all. A docs-only PR should
  # not build an APK and boot an emulator for 30 minutes.
  #
  # This is deliberately NOT `paths-ignore` on the trigger. `E2E Tests (Maestro)`
  # is a required status check, and a workflow skipped by paths-ignore never
  # reports its checks at all, so protection would wait forever and the PR could
  # never merge. Instead the workflow always runs, the costly jobs are
  # conditional, and the gate below treats a skipped suite as a pass.
  #
  # Fail-safe direction is to RUN: anything we cannot classify builds.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-e2e: ${{ steps.filter.outputs.run-e2e }}
      skip-reason: ${{ steps.filter.outputs.skip-reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual dispatch: always run."
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A DRAFT pull request is still being iterated on, so building an APK
          # and booting two emulators for every push is work nobody reads. GitHub
          # refuses to merge a draft, so a green-and-skipped gate here cannot land
          # anything: marking the PR ready re-fires this workflow (see the
          # `ready_for_review` trigger type above) and pays for the suites once,
          # before the merge that needs them.
          #
          # Note this is not a per-push saving: the concurrency group above
          # already cancels a superseded run. What it saves is STARTING work that
          # would be cancelled, which is runner capacity the other jobs contend
          # for.
          if [ "${IS_DRAFT:-}" = "true" ]; then
            echo "Draft pull request: skipping the E2E build and emulators until it is marked ready for review."
            echo "run-e2e=false" >> "$GITHUB_OUTPUT"
            echo "skip-reason=draft" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # An empty or all-zero base (first push of a branch, force push) means
          # we cannot diff, so run.
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "No usable base SHA: running to be safe."
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! changed="$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null)"; then
            echo "Could not diff against $BASE_SHA: running to be safe."
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          printf '%s\n' "$changed"

          # Anything that cannot change the APK is skippable. Three notes on the
          # list below, all learned the expensive way:
          #
          #   ^tests/  is safe because NOTHING under tests/ ships in the binary.
          #            A tests-only diff produces a byte-identical APK, so the
          #            E2E suites could only re-confirm what the last run
          #            already proved, at the cost of ~10 minutes. The unit and
          #            component tiers still run on it, because ci.yml has no
          #            path filter at all - so a broken test is still caught,
          #            just not by an emulator.
          #
          #   ^store/screenshots/ holds the PNGs uploaded to the Play and App
          #            Store listings: product imagery, not code. Without it
          #            every re-capture would build an APK and boot two
          #            emulators for half an hour to validate image files, and
          #            one re-capture rewrites 18 of them at once. Deliberately
          #            NARROW - the output directory only. The capture script
          #            (scripts/storeScreenshots.mjs) and the flow that drives
          #            it (.maestro/screenshots/) are code and still force a run.
          #
          #   .github/ is deliberately NOT here. A workflow change must be
          #            exercised by the thing it changes.
          #
          # This classifier fails safe by RUNNING, so widening it further is a
          # decision to take on its own merits, not a convenience.
          if printf '%s\n' "$changed" | grep -qvE '(^|/)[^/]*\.(md|mdx)$|^docs/|^\.claude/|^tests/|^LICENSE$|^CLA\.md$|^store/screenshots/'; then
            echo "Non-documentation changes present: running E2E."
            echo "run-e2e=true" >> "$GITHUB_OUTPUT"
          else
            # `no-app-change`, not `docs`: this branch now covers tests/ and
            # store imagery too, and a check reading "skipped (docs)" on a
            # tests-only or screenshots-only PR would be a lie of exactly the
            # kind naming the reason was supposed to prevent.
            echo "Nothing in this diff can change the APK: skipping the E2E build and emulators."
            echo "run-e2e=false" >> "$GITHUB_OUTPUT"
            echo "skip-reason=no-app-change" >> "$GITHUB_OUTPUT"
          fi

  # Builds the binary the flows run against. The e2e profile is release-shaped
  # (no Metro dependency, no dev menu), which is why per-flow runtime is far
  # lower than against a dev client. scripts/androidAbis.mjs gives it x86_64,
  # matching the emulator system image: an arm64-only APK will not install.
  #
  # This overlaps with build-android.yml's build job. Kept separate rather than
  # made a reusable workflow so a change here cannot break the release path;
  # consolidating is a follow-up once both are proven in anger.
  build-apk:
    name: Build (APK)
    needs: changes
    if: needs.changes.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      apk-name: ${{ steps.name.outputs.apk-name }}
    env:
      BUILD_PROFILE: e2e
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-deps

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v4, not v3. v3 declared `node20`, which GitHub is already force-running on
      # node24. The bump also moves the default cmdline-tools to 20.0, which is a
      # real behaviour change and not just a runtime bump: if this job breaks
      # right after this line changed, that default is the first suspect, and
      # pinning `cmdline-tools-version` is the fix rather than reverting to a
      # runtime that is being removed.
      - uses: android-actions/setup-android@v4

      # Must precede prebuild: app.config.ts reads EXPO_PUBLIC_KANGENTIC_E2E at
      # config-evaluation time, and GITHUB_ENV only affects later steps.
      - name: Export the profile env from eas.json
        run: node scripts/easProfile.mjs "$BUILD_PROFILE" --github-env

      - name: Resolve the ABI set
        id: abis
        run: echo "abis=$(node scripts/androidAbis.mjs "$BUILD_PROFILE")" >> "$GITHUB_OUTPUT"

      - name: Materialize google-services.json
        if: env.HAS_GOOGLE_SERVICES == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > google-services.json

      - name: Decode the upload keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kangentic-upload.jks"

      # KNOWN LIMITATION: a FORK PR cannot pass this check.
      #
      # Forks get no secrets, so this step fires and the required
      # `E2E Tests (Maestro)` check goes red with nothing the contributor can do
      # about it. A maintainer has to push the branch in-repo and let CI run
      # there. That is a real gap for a public repo with a CLA bot, and it is
      # deliberately left open rather than papered over, because the obvious
      # fixes are each worse than the gap:
      #
      #  - Dropping the injected signing properties does NOT fall back to debug
      #    signing. It emits an UNSIGNED release APK that will not install;
      #    build-android.yml says so where it switches to the debug variant.
      #  - Building the debug variant is wrong here: the e2e profile is
      #    release-shaped precisely so no Metro is needed (see this job's
      #    header), and a debug build expects a bundler no runner has.
      #  - Generating an ephemeral keystore works, but it means teaching
      #    verify-android-signature.sh to accept a signer other than the upload
      #    key, and that script guards the real Play upload. Loosening a release
      #    guard to serve a hypothetical contributor is the wrong trade.
      #
      # Close it when an actual external contribution needs it, and verify the
      # fallback path by forcing HAS_KEYSTORE=false on a scratch branch first.
      - name: Fail without a keystore
        if: env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::ANDROID_KEYSTORE_BASE64 is required: a release-shaped APK must be signed to install on the emulator. On a fork PR this check cannot pass; a maintainer must re-run the branch in-repo."
          exit 1

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install

      # DO NOT CACHE android/app/.cxx HERE. It was tried on 2026-07-28 and
      # measured, and it does not work. Recorded so nobody spends the afternoon
      # again.
      #
      # The motivation was sound: `:app:buildCMakeRelWithDebInfo[x86_64]` is ~2m
      # of a ~6m30 Gradle build and is the only large task Gradle's own build
      # cache cannot help with, because external native build tasks are not
      # cacheable. Everything else expensive already reports FROM-CACHE (415 of
      # 1055 tasks), so CMake is the whole remaining target.
      #
      # An actions/cache over android/app/.cxx, keyed on native inputs only and
      # restored AFTER prebuild (prebuild CLEARS android/, so restoring before it
      # is useless), produced a genuine hit on a 16 MB entry:
      #
      #   cache MISS, run 30387646820   CMake 2m 07s
      #   cache HIT,  run 30389177999   CMake 1m 48s
      #
      # ~19 seconds, on a job whose own run-to-run spread is 6m 03s to 8m 37s. So
      # the saving is inside the noise, and the reason is mtimes: `expo prebuild`
      # regenerates android/ with fresh timestamps, ninja is mtime-driven, and it
      # therefore rebuilt nearly everything despite having every object file.
      #
      # The fix that WOULD work is content-addressed rather than timestamp-driven
      # (ccache, via CMAKE_C_COMPILER_LAUNCHER). Under CNG that means a config
      # plugin plus a Gradle property, which is real machinery for ~2 minutes on
      # a job that is not on the critical path for a merge. Not obviously wrong
      # to revisit, but go in knowing the mtime trap is what has to be solved.

      # v5, and DELIBERATELY NOT the latest. v5's only breaking change is the
      # move to node24, which is the whole reason for the bump. v6 extracted the
      # caching half of this action into `gradle-actions-caching`, a proprietary
      # component that is NOT open source and is governed by Gradle's commercial
      # Terms of Use, which upgrading accepts on the project's behalf. This
      # repository is AGPLv3 and dual-licensed, so that is a licensing decision
      # for a human, not a version bump. v6 also removed configuration-cache
      # support pending a reimplementation inside that same proprietary
      # component. Revisit only with the licence question answered first.
      #
      # The bump was expected to cost a full cache miss on the first build, since
      # the action version feeds the cache key. It did not, and the DURATION is
      # not what says so:
      #
      #   v4   Build (APK) 7m 23s                            640 executed, 415 from cache
      #   v5   Build (APK) 7m 52s, 8m 14s, 8m 19s, 8m 28s    640 executed, 415 from cache
      #
      # Byte-identical task reuse rules out invalidation: the Gradle User Home
      # entry resolved through a RESTORE KEY rather than an exact one, and every
      # sub-cache (dependencies, transforms, kotlin-dsl, wrapper) hit outright.
      # That is the settled part, and the DURATIONS are not what settled it.
      #
      # Four v5 samples spanning 36s against one v4 sample is not a comparison.
      # Do not build one out of it: this note was rewritten three times as
      # samples arrived and was confidently wrong each time, most recently on an
      # argument about three runs "clustering" that a fourth run dissolved. The
      # bump is not optional anyway, since v4 declares a Node runtime being
      # removed. Full write-up in docs/developer-guide.md.
      - uses: gradle/actions/setup-gradle@v5

      # DO NOT ADD `-x :app:lintVitalRelease` HERE. It was tried on 2026-07-30,
      # measured across five runs, and it buys nothing. Recorded so nobody
      # rediscovers the premise and spends the afternoon again.
      #
      # The premise was sound and is still TRUE: `-x lint` does NOT cover
      # `lintVitalRelease`. They are different tasks - `lint` is the standalone
      # check, `lintVitalRelease` is the fatal-issues pass AGP wires into
      # assembleRelease - so this invocation really has been paying for release
      # lint the whole time. Excluding it works exactly as intended and prunes
      # the entire model-generation chain: 1029 actionable tasks fall to 672, and
      # all 54 lintVital tasks disappear rather than merely thinning out.
      #
      # It just does not make the job faster, because those tasks were never on
      # the critical path. Each run below is normalised against
      # buildCMakeRelWithDebInfo + minifyReleaseWithR8, which are identical work
      # in both arms, because the raw clock is useless here - see the note above
      # setup-gradle and the cache-health table in docs/developer-guide.md.
      #
      #   lint ON   n=2   421s, 522s          ratios 2.41, 2.13   mean 2.27
      #   lint OFF  n=3   536s, 405s, 514s    ratios 2.12, 2.60, 2.21   mean 2.31
      #
      # Excluding it came out marginally WORSE on both raw total and ratio, with
      # the two arms overlapping completely. The detection floor at these sample
      # sizes is about +-60s, so this rules out a saving of minutes and does not
      # rule out one of a few seconds. Either way it is inside the noise.
      #
      # WHAT MISLED THE FIRST PASS, worth knowing because the trap is general: on
      # a cache-starved run (30506459459, 147 of 1029 tasks from cache) 52 of 54
      # lintVital tasks executed and `generateReleaseLintVitalModel` occupied a
      # 121.3s window with nothing else printing, which reads as a serial stall on
      # the critical path. It is not - it is what parallel work looks like when
      # the whole graph is executing at once. On a warm run the same tasks
      # overlap the native compile and cost nothing.
      #
      # NOT TESTED: whether the exclusion helps on a COLD cache, where everything
      # executes and the runner is saturated. Plausible, unmeasured, and not
      # worth optimising for once cache-cleanup.yml keeps the cache healthy.
      - name: Build the release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_ABIS: ${{ steps.abis.outputs.abis }}
        run: |
          set -euo pipefail
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease \
            -x lint \
            -x test \
            --parallel \
            --build-cache \
            "-PreactNativeArchitectures=$BUILD_ABIS" \
            "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/kangentic-upload.jks" \
            "-Pandroid.injected.signing.store.password=$ANDROID_KEYSTORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$ANDROID_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$ANDROID_KEY_PASSWORD"

      - name: Verify the APK is signed and carries the expected ABIs and assets
        env:
          BUILD_ABIS: ${{ steps.abis.outputs.abis }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          bash .github/scripts/verify-android-signature.sh "$apk" apk
          bash .github/scripts/verify-android-abis.sh "$apk" apk "$BUILD_ABIS"
          # Resource shrinking is the half of R8 with no escape hatch in
          # expo-build-properties, and xterm.html is named from the JS bundle,
          # which the shrinker never scans. This is the only thing standing
          # between a shrunk-away Terminal pane and a fully green run. See the
          # script's header for why it matches on size rather than on path.
          bash .github/scripts/verify-android-assets.sh "$apk"

      - name: Stage the APK
        id: name
        run: |
          set -euo pipefail
          echo "apk-name=kangentic-e2e-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kangentic-e2e-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.apk-name }}
          path: ${{ runner.temp }}/${{ steps.name.outputs.apk-name }}.apk
          # 1 day, not the 90-day default. This is a throwaway build that only
          # needs to survive long enough for the maestro job to download it, and
          # every PR push produces another ~60 MB. Public repos get free minutes,
          # not free storage.
          retention-days: 1
          if-no-files-found: error

  maestro:
    # `matrix.label`, not `matrix.suite`: `suite` is the slug (it names the
    # artifact), `label` is what a human reads in the checks list. One key would
    # have to be both, and the last time this job named itself from the slug the
    # checks list read `E2E Tests (smoke)` next to `E2E Tests (Maestro)`.
    name: E2E Tests (${{ matrix.label }})
    needs: [changes, build-apk]
    if: needs.changes.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The smoke suite only. The paired suite is the separate
        # `maestro-paired` job below, kept out of this matrix because it needs
        # extra steps (relay checkout, Node) that would otherwise run for
        # smoke too, and because it must NOT contribute to `needs.maestro.result`
        # below, which is what the required gate tests.
        include:
          - suite: smoke
            label: Smoke
            flows: .maestro/smoke.yaml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-apk.outputs.apk-name }}
          path: apk

      # Maestro is a JVM tool. The runner image happens to ship a JDK, but
      # pinning it means an image change cannot silently break this job.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs the PINNED version: the installer reads MAESTRO_VERSION from the
      # workflow-level `env:` at the top of this file. Do not set it here.
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls https://get.maestro.mobile.dev > "$RUNNER_TEMP/install-maestro.sh"
          bash "$RUNNER_TEMP/install-maestro.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Asserts the pin took, rather than just printing it for a human who is not
      # reading. An installer change, a typo in the version, or a job-level `env:`
      # shadowing the pin all fail HERE, in two seconds, instead of surfacing as
      # inexplicable flow behaviour ten minutes later.
      - name: Report the Maestro version
        run: |
          set -euo pipefail
          # `tail -n 1`, not the whole output. `maestro --version` prints an
          # analytics notice and a blank line BEFORE the number, so comparing the
          # raw capture would never match and this guard would redden the required
          # check on every run. MAESTRO_CLI_NO_ANALYTICS (workflow-level `env:`)
          # already suppresses that notice; the tail is the belt to its braces,
          # because a future banner would otherwise break the gate, not the tool.
          installed="$(maestro --version | tr -d '\r' | tail -n 1)"
          echo "Maestro $installed (pinned: $MAESTRO_VERSION)"
          if [ "$installed" != "$MAESTRO_VERSION" ]; then
            echo "::error::Maestro $installed was installed but $MAESTRO_VERSION is pinned in e2e.yml. The suites are not running the version this repository tests against."
            exit 1
          fi

      # The emulator needs hardware acceleration to be usable. ubuntu-latest has
      # KVM available but not world-writable by default.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Must match the APK's ABI (scripts/androidAbis.mjs gives e2e x86_64).
          arch: x86_64
          # `default`, NOT `google_apis`. With Play Services the emulator thrashes
          # during boot: gms churn refilled a freshly cleared logcat buffer within
          # seconds, ActivityManager was killing and restarting
          # settings.intelligence, and gms services were failing to bind. The smoke
          # flow runs against a fresh unpaired install and exercises no push, so it
          # needs none of that. Diagnostics on the failing runs showed the app
          # process alive with MainActivity resumed and focused but nothing
          # rendered after 45s, which is starvation rather than a crash or a hang.
          #
          # A future paired suite that tests remote push WILL need google_apis; add
          # it as a separate matrix entry then rather than making every flow pay for
          # it.
          target: default
          profile: pixel_6
          # -no-snapshot-save keeps teardown from writing a snapshot we never reuse.
          #
          # DO NOT set ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL. Teardown prints
          # "Wait for emulator (pid N) 20 seconds to shutdown gracefully before
          # kill", which reads like 20 seconds this job spends on an emulator
          # nobody will ever use again. It is a CEILING, not a cost: the emulator
          # exits well inside it and the wait ends. Measured on run 30397988677,
          # `emu kill` to the last teardown line - smoke 20:58:33.83 to
          # 20:58:34.86 (1.0s), paired 21:05:38.70 to 21:05:39.58 (0.9s).
          # Overriding it would save nothing and would introduce a hard kill on a
          # process mid-write.
          #
          # `ERROR | Failed to find ColorBuffer: <n>` in the paired log is
          # swiftshader bookkeeping noise on a headless GPU, not a failure. It
          # appeared three times in an 11/11 green run.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -memory 4096
          disable-animations: true
          script: bash .github/scripts/run-maestro.sh "$(ls apk/*.apk | head -n 1)" ${{ matrix.flows }}

      - name: Upload Maestro artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-${{ matrix.suite }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/maestro-output
            ${{ runner.temp }}/maestro-debug
          retention-days: 7
          # A failing flow is exactly when these matter, so upload on failure too
          # (the `if: !cancelled()` above), but never fail the job over a missing
          # screenshot. maestro-debug (not maestro-output) is where --debug-output
          # actually writes the failure screenshot, command log, and view
          # hierarchy - it was missing from this upload for a while, which is how
          # the first failing run's artifact turned out to hold nothing
          # diagnostic.
          if-no-files-found: ignore

  # The paired suite: checks out the relay, pairs to the stub, runs
  # .maestro/paired. Advisory (see the header comment above) - its result is
  # deliberately NOT read by the `e2e` gate job below, and it carries no
  # "Required" badge in the checks list, which is what says so.
  #
  # Named `E2E Tests (Paired)` in the same Title Case as every other row; the
  # badge, not the casing, is what distinguishes it from the gate. See the gate
  # job's naming comment at the bottom of this file.
  maestro-paired:
    name: E2E Tests (Paired)
    needs: [changes, build-apk]
    if: needs.changes.outputs.run-e2e == 'true'
    runs-on: ubuntu-latest
    # Local runtime for the 11 flows is 15-20 minutes (.claude/skills/e2e/SKILL.md),
    # on top of emulator boot, APK install, relay start, and pairing. The app
    # never reports UI-idle, so Maestro falls back to settled-hierarchy aiming
    # and pays 6-8s per tap - tracked separately, but it is why this budget is
    # roughly double the smoke job's.
    #
    # MEASURED in CI 2026-07-28: 9m 08s and 15m 11s for the SAME commit. Per flow
    # is 17-40s; the whole spread between those two runs is ONE flow stalling.
    #
    # DIAGNOSED, from commands.json in the paired artifacts: it is a hung
    # `launchApp`, not diffuse slowness. Twice, on two different flows, that one
    # command took 362.2s and 370.5s while every other command in the flow was
    # normal and every other flow's launchApp in the same run was 1.1-2.9s. It
    # blocks inside launchApp's first `adb shell pm grant` (649ms healthy), and
    # device-logcat runs continuously through the window with no ANR and no
    # mention of our package, so the emulator is alive and it is host-side adb.
    #
    # It self-resolves and the flow then passes, so it costs duration and not
    # correctness; both runs were 11/11. run-maestro-paired.sh prints a per-flow
    # table into the run summary so a recurrence is visible without downloading
    # an artifact. Full write-up in .claude/rules/e2e-maestro-runs.md.
    #
    # WHERE THE NON-FLOW TIME GOES, measured on run 30397988677 (8m 58s job,
    # 5m 48s of actual flows). SDK install 30s, emulator boot 33s, APK install
    # 5s, relay + stub + pairing URI 2s, and then the PAIRING BOOTSTRAP at 1m 12s
    # - of which a single `Input text ${PAIRING_URI}` command is 40.7s
    # (20:58:53.19 to 20:59:33.90). Maestro types the URI a character at a time
    # over the driver, and the URI is a public key plus a token plus a relay
    # address. Reproduced at 40.5s on run 30401393044, so it is a property of
    # the command and not the bursty launchApp stall described below.
    #
    # NOT FIXED, deliberately. Every route to it is worse than 40 seconds on a
    # job that is advisory and off the critical path for a merge: the clipboard
    # cannot be set from adb on API 29+ without a foreground app; `adb shell
    # input text` types character by character too and would need the URI's `//`
    # escaped; and the deep-link route needs OS routing of kangentic-pair://,
    # which is a later phase. The remaining option is changing the pairing
    # ceremony itself, which is the security-critical path this suite exists to
    # prove. Recorded so the next reader sees a decision, not an oversight.
    #
    # THIS SUITE IS SERIAL AND UNSHARDED, which is the growth cliff worth knowing:
    # each flow added costs its own ~35s plus a `launchApp` cold boot, and nothing
    # warns you. Shard it (a matrix over slices of .maestro/paired, each booting
    # its own emulator) once the NORMAL-case runtime passes ~15 minutes. Not
    # before: sharding changes flow ordering, and this suite already had one
    # failure that looked like flow coupling and was not. Doing it also means
    # updating readAdvisoryFlowEntries() in tests/unit/ciSafeMaestroFlows.test.ts,
    # which today matches a single trailing literal argument.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-node-deps

      # scripts/stubDesktopPeer.mjs imports @kangentic/protocol, so the runner
      # needs Node + node_modules - the smoke job needs neither.

      # Kangentic/relay is public, so CI can check it out directly. Pinned to
      # a SHA rather than `main`: an unpinned checkout would let a commit in a
      # sibling repo redden every mobile PR, which is exactly the "required
      # check that cannot pass" hazard this job is built to avoid, arriving
      # through a side door. Bump by updating the ref below once the new SHA
      # has been smoke-tested against this suite.
      - uses: actions/checkout@v7
        with:
          repository: Kangentic/relay
          ref: 7a8d3a69b522c81fb72dbac373e607a178d51855
          path: relay-src

      # Builds with whatever Node setup-node-deps selected from THIS repo's
      # .nvmrc (22). The relay's own engines field is >=20 and its
      # .node-version is 22, so that lines up - but by coincidence, not by
      # construction. If this repo's .nvmrc ever drops below the relay's
      # floor, this step is where it surfaces.
      - name: Build the relay
        working-directory: relay-src
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build-apk.outputs.apk-name }}
          path: apk

      # Maestro is a JVM tool. The runner image happens to ship a JDK, but
      # pinning it means an image change cannot silently break this job.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs the PINNED version: the installer reads MAESTRO_VERSION from the
      # workflow-level `env:` at the top of this file. Do not set it here.
      - name: Install Maestro
        run: |
          set -euo pipefail
          curl -Ls https://get.maestro.mobile.dev > "$RUNNER_TEMP/install-maestro.sh"
          bash "$RUNNER_TEMP/install-maestro.sh"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Asserts the pin took, rather than just printing it for a human who is not
      # reading. An installer change, a typo in the version, or a job-level `env:`
      # shadowing the pin all fail HERE, in two seconds, instead of surfacing as
      # inexplicable flow behaviour ten minutes later.
      - name: Report the Maestro version
        run: |
          set -euo pipefail
          # `tail -n 1`, not the whole output. `maestro --version` prints an
          # analytics notice and a blank line BEFORE the number, so comparing the
          # raw capture would never match and this guard would redden the required
          # check on every run. MAESTRO_CLI_NO_ANALYTICS (workflow-level `env:`)
          # already suppresses that notice; the tail is the belt to its braces,
          # because a future banner would otherwise break the gate, not the tool.
          installed="$(maestro --version | tr -d '\r' | tail -n 1)"
          echo "Maestro $installed (pinned: $MAESTRO_VERSION)"
          if [ "$installed" != "$MAESTRO_VERSION" ]; then
            echo "::error::Maestro $installed was installed but $MAESTRO_VERSION is pinned in e2e.yml. The suites are not running the version this repository tests against."
            exit 1
          fi

      # The emulator needs hardware acceleration to be usable. ubuntu-latest has
      # KVM available but not world-writable by default.
      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Pair and run the paired Maestro suite on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # Must match the APK's ABI (scripts/androidAbis.mjs gives e2e x86_64).
          arch: x86_64
          # `default`, NOT `google_apis` - same reasoning as the smoke job
          # above: Play Services starves this app during boot. None of the 11
          # paired flows exercise remote push, so nothing here needs it. A
          # future flow that does should get its own matrix entry rather than
          # moving this one back.
          target: default
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -camera-back none -memory 4096
          disable-animations: true
          script: bash .github/scripts/run-maestro-paired.sh "$(ls apk/*.apk | head -n 1)" "$GITHUB_WORKSPACE/relay-src" .maestro/paired

      - name: Upload Maestro paired artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-paired-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/maestro-report.xml
            ${{ runner.temp }}/maestro-output
            ${{ runner.temp }}/maestro-debug
            ${{ runner.temp }}/maestro-debug-bootstrap
            ${{ runner.temp }}/relay.log
            ${{ runner.temp }}/stub.log
          retention-days: 7
          # A paired failure with no relay or stub log is undiagnosable, so
          # both ride along with the same never-fail-the-job semantics as the
          # smoke job's upload.
          if-no-files-found: ignore

  # Thin required gate, mirroring the ci.yml tiers: this single check is what
  # branch protection requires, so suites can be added without touching it.
  #
  # It must run on every event, including when the suites were skipped for a
  # docs-only change, or protection would never see the check report.
  #
  # NAMED to match the kangentic desktop repo's gate convention (`E2E Tests
  # (Electron)` there, `E2E Tests (Maestro)` here), so the two repos' check
  # lists read as one system.
  #
  # The qualifier is Title Case in EVERY row: `E2E Tests (Smoke)`,
  # `E2E Tests (Paired)`, `E2E Tests (Maestro)`. Lowercasing the suite jobs was
  # tried and dropped - it spent a casing distinction on saying "worker, not
  # gate", which GitHub's own "Required" badge already says, and it read as a
  # typo sitting next to the capitalised gate. Same argument as the advisory
  # note above: the badge is the honest signal, so the name does not have to
  # carry it. Shard rows keep `n/m` because a number is self-evidently a piece
  # of something.
  #
  # This is also why the WORKFLOW is called `Emulator` rather than `E2E`.
  # GitHub renders a check as "<workflow> / <job>", so keeping both would have
  # stuttered as "E2E / E2E Tests (Maestro)". The workflow name is not a
  # protection context, so it was the free half of the pair to change.
  #
  # The job name IS a required-check context, so it does not change casually.
  # Renaming it means updating main's branch protection in the same change, or
  # every PR blocks on a context that will never report. Honesty about current
  # coverage goes in the run summary below, where it is visible at the point of
  # use, rather than in the name.
  e2e:
    name: E2E Tests (Maestro)
    needs: [changes, maestro]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on suite results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_E2E: ${{ needs.changes.outputs.run-e2e }}
          SKIP_REASON: ${{ needs.changes.outputs.skip-reason }}
          MAESTRO_RESULT: ${{ needs.maestro.result }}
        run: |
          set -euo pipefail

          # FAIL CLOSED on the classifier, and check it BEFORE reading its output.
          #
          # `run-e2e` is a job OUTPUT, so it is the empty string whenever the
          # `changes` job did not finish successfully. The skip branch below tests
          # `!= "true"`, which an empty string satisfies - so without this guard a
          # `changes` job that failed on a checkout flake, a git error, or its own
          # timeout made this REQUIRED check exit 0, green, having run nothing and
          # having built nothing. `Changes` is not itself a required
          # context, so nothing else stopped that PR merging.
          #
          # `!= success` rather than `== failure`, matching ci.yml's thin gates: a
          # cancelled run already reports red on every other gate in this repo, so
          # treating cancellation as not-success is the established behaviour here
          # rather than new noise.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::The change classifier did not succeed (result: $CHANGES_RESULT), so this gate cannot tell whether E2E was needed. Failing closed."
            exit 1
          fi

          if [ "$RUN_E2E" != "true" ]; then
            # Name the reason rather than just saying "skipped", which invites the
            # reader to assume coverage this run did not provide. The classifier
            # sets it; a draft re-runs this workflow the moment it is marked ready,
            # and GitHub will not merge a draft, so nothing can land on either skip.
            {
              echo "### E2E skipped (${SKIP_REASON:-no reason given})"
              echo ""
              echo "No APK was built and no emulator was booted."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "E2E skipped: ${SKIP_REASON:-no reason given}. Nothing to run."
            exit 0
          fi

          {
            echo "### E2E coverage for this run"
            echo ""
            echo "| Suite | Flows | Gates the merge? |"
            echo "|---|---|---|"
            echo "| Smoke | 1 | yes - this check |"
            echo "| Paired | 11 | no - see the separate \"E2E Tests (Paired)\" check |"
            echo ""
            echo "The paired suite runs in its own job and reports its own check, but is not"
            echo "read by this gate: it is advisory until it has been green across several PRs,"
            echo "at which point it is promoted into this gate (see e2e.yml's header comment)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$MAESTRO_RESULT" != "success" ]; then
            echo "One or more Maestro suites did not succeed (result: $MAESTRO_RESULT)"
            exit 1
          fi
          echo "All Maestro suites passed."
