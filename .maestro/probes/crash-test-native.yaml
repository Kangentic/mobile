appId: com.kangentic.mobile
---
# CRASH-REPORTING PROBE, the native half. Not a test, and not part of either
# E2E suite. See crash-test-js.yaml for the full reasoning; this flow differs
# only in the row it taps.
#
# `Sentry.nativeCrash()` on iOS is a signal-level crash caught by
# sentry-cocoa's SentryCrash handler - the path no JavaScript `beforeSend` can
# see, and the one that decides whether iOS dSYMs symbolicate at all. Like the
# JS throw, the envelope is stored on disk and sent on the NEXT launch, which
# the workflow step performs.
- launchApp
- extendedWaitUntil:
    visible:
      text: "Agents"
    timeout: 45000
# The same walk as crash-test-js.yaml, for the same reason and with its
# comments: pair with the demo desktop if this install is not paired yet (it
# is, when this flow runs second), open a task, change lens twice, come back.
# THIS is the flow whose event matters most for task #152: a native crash
# never passes through JavaScript, so its event shows what the native scope
# was actually holding.
- extendedWaitUntil:
    visible:
      id: "triage-pair-cta"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "triage-pair-cta"
    commands:
      - tapOn:
          id: "triage-pair-cta"
      - extendedWaitUntil:
          visible:
            id: "pairing-paste-link-input"
          timeout: 20000
      - tapOn:
          id: "pairing-paste-link-input"
      - inputText: "demo"
      - runFlow:
          when:
            platform: Android
          commands:
            - hideKeyboard
      - runFlow:
          when:
            platform: iOS
          commands:
            - pressKey: Enter
      - extendedWaitUntil:
          visible:
            id: "pairing-paste-link-submit"
          timeout: 10000
      - tapOn:
          id: "pairing-paste-link-submit"
      - extendedWaitUntil:
          visible:
            id: "sas-accept"
          timeout: 30000
      - tapOn:
          id: "sas-accept"
- extendedWaitUntil:
    visible:
      id: "triage-home-list"
    timeout: 60000
- extendedWaitUntil:
    visible:
      text: "Approve:.*"
    timeout: 90000
- tapOn:
    id: "activity-row-mock-session-1"
- extendedWaitUntil:
    visible:
      id: "session-screen"
    timeout: 45000
- tapOn:
    id: "session-mode-terminal"
- runFlow:
    when:
      notVisible:
        id: "terminal-webview"
    commands:
      - tapOn:
          id: "session-mode-terminal"
- tapOn:
    id: "session-mode-chat"
- runFlow:
    when:
      notVisible:
        id: "conversation-list"
    commands:
      - tapOn:
          id: "session-mode-chat"
- tapOn:
    id: "task-back-button"
- extendedWaitUntil:
    visible:
      id: "triage-home-list"
    timeout: 30000
- tapOn:
    id: "header-settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 20000
# Centred, not merely reached: see crash-test-js.yaml for the run where a row
# counted as visible while clipped below its scroll container, and the tap
# landed on nothing.
- scrollUntilVisible:
    element:
      id: "settings-crash-test-native"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: "settings-crash-test-native"
# The process dies inside the tap. The screen vanishing is the assertion; the
# workflow's verdict is the process table (the app is gone), with a crash
# report collected afterwards as bonus evidence only. See the
# assert_app_died comment in build-ios.yml.
- extendedWaitUntil:
    notVisible:
      id: "settings-screen"
    timeout: 20000
