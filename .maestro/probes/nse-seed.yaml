appId: com.kangentic.mobile
---
# NSE PROBE, first half. Not a test, and not part of either E2E suite.
#
# Seeds the known probe vectors into the shared Keychain from Settings and
# asks for notification permission, so that the workflow step can `simctl
# push` an envelope sealed with the same vectors and the extension has both
# a key to read and permission to render. Only `build-ios.yml -f
# nse_probe=true` runs it, against a build whose bundle carries
# EXPO_PUBLIC_KANGENTIC_NSE_PROBE=1 and the un-prefixed shared Keychain
# group; on any other build the rows do not exist and scrollUntilVisible
# times out. See src/devsupport/nseProbeVectors.ts.
- launchApp
- extendedWaitUntil:
    visible:
      text: "Agents"
    timeout: 45000
- tapOn:
    id: "header-settings-button"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 20000
# Centred, not merely reached: see crash-test-js.yaml for the run where a row
# counted as visible while clipped below its scroll container.
- scrollUntilVisible:
    element:
      id: "settings-nse-probe-seed"
    direction: DOWN
    visibilityPercentage: 100
    centerElement: true
    timeout: 30000
- tapOn:
    id: "settings-nse-probe-seed"
# THE OS PERMISSION ALERT IS NOT TAPPED HERE, deliberately. Maestro's iOS
# driver runs on XCTest, whose interruption handling accepts a system alert
# the moment the driver queries the hierarchy - and a wait IS a hierarchy
# query. Two runs proved it: 34709809847 answered the alert on a guarded
# tap's first pass and then failed re-tapping the vanished alert;
# 34711341847 saw "Allow" in a 3-second wait and then could not find it to
# tap 14 seconds later, with "Seeded, permission granted" already on screen.
# So the seeded label below is the only assertion: it renders only when
# both the Keychain writes AND the permission request resolved, so the
# alert being answered (by whoever) is part of what it proves. A seed
# failure renders settings-nse-probe-seed-error with the message instead
# and this times out with that text in the failure screenshot, which is how
# an errSecMissingEntitlement is told apart from a decrypt failure.
- extendedWaitUntil:
    visible:
      id: "settings-nse-probe-seeded"
    timeout: 45000
