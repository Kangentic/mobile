appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# The stub raises a permission prompt ~20s in; Home's needs-you card must
# surface it and answer it INLINE - without ever opening the task.
- launchApp
- extendedWaitUntil:
    visible:
      id: "needs-you-card-stub-session-1"
    timeout: 45000
- extendedWaitUntil:
    visible:
      id: "permission-approve"
    timeout: 15000
- tapOn:
    id: "permission-approve"
- extendedWaitUntil:
    notVisible:
      id: "needs-you-card-stub-session-1"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 15000
