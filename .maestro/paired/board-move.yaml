appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# Long-press a board card, move it to Done through the actions-sheet hop;
# the stub's board is stateful, so the card lands in the Done column.
- launchApp
# 60s: the dev client cold-boots the bundle after launchApp's force-stop;
# wait for the tab bar instead of tapping into a still-booting app.
- extendedWaitUntil:
    visible:
      id: "board-tab"
    timeout: 60000
- tapOn:
    id: "board-tab"
- extendedWaitUntil:
    visible:
      id: "board-card-stub-task-1"
    timeout: 20000
- longPressOn:
    id: "board-card-stub-task-1"
- assertVisible:
    id: "task-actions-sheet"
- tapOn:
    id: "task-action-move"
- assertVisible:
    id: "move-task-sheet"
- tapOn:
    id: "move-target-lane-done"
- tapOn:
    id: "move-confirm"
- extendedWaitUntil:
    notVisible:
      id: "move-task-sheet"
    timeout: 10000
