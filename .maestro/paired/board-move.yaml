appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# Long-press a board card, move it to Done; the stub acks move-task and its
# console logs the received verb.
- launchApp
- tapOn:
    id: "board-tab"
- extendedWaitUntil:
    visible:
      id: "board-card-stub-task-1"
    timeout: 20000
- longPressOn:
    id: "board-card-stub-task-1"
- assertVisible:
    id: "move-task-sheet"
- tapOn:
    id: "move-target-lane-done"
- tapOn:
    id: "move-confirm"
- extendedWaitUntil:
    notVisible:
      id: "move-task-sheet"
    timeout: 10000
