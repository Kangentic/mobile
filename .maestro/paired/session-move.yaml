appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# The session header's current-column chip: shows where the task sits, tap
# opens the move-task sheet (the same sheet board-move.yaml reaches through
# the long-press actions hop). stub-task-1 starts in Doing every flow (the
# stub restores its canned board on session establish). A move to a column
# whose role is To Do or Done LEAVES the session screen, back to wherever
# the task was opened from: neither destination promises a successor
# session, so there is nothing for the screen to wait for (leaveScreen in
# src/screens/task/SessionScreen.tsx; docs/architecture.md, "Transitional
# states"). The sheet writes the task into the target column optimistically,
# so the leave follows the confirm at once. This flow therefore enters from
# the Agents feed, which makes the feed the deterministic landing spot, and
# proves the move landed on the board rather than on a chip that no longer
# exists.
- launchApp
# 60s: cold boot + channel re-establish after launchApp's force-stop.
- extendedWaitUntil:
    visible:
      id: "triage-home-list"
    timeout: 60000
# The Agents feed's section collapse is PERSISTED, so it survives launchApp
# and leaks between flows. Wait for the header first, then expand only if
# the row is still missing (same defensive entry as open-task-from-triage).
- extendedWaitUntil:
    visible:
      id: "section-header-idle"
    timeout: 60000
- runFlow:
    when:
      notVisible:
        id: "activity-row-stub-session-1"
    commands:
      - tapOn:
          id: "section-header-idle"
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 20000
- tapOn:
    id: "activity-row-stub-session-1"
- extendedWaitUntil:
    visible:
      id: "session-screen"
    # 45s: this screen mounts all three panes at once, terminal WebView
    # included. 20s held only on a warm emulator.
    timeout: 45000
# The chip renders once the board snapshot locates the task.
- extendedWaitUntil:
    visible:
      id: "task-header-column"
    timeout: 15000
- tapOn:
    id: "task-header-column"
- extendedWaitUntil:
    visible:
      id: "move-task-sheet"
    timeout: 10000
- tapOn:
    id: "move-target-lane-todo"
- tapOn:
    id: "move-confirm"
- extendedWaitUntil:
    notVisible:
      id: "move-task-sheet"
    timeout: 10000
# The session screen leaves on the To Do role. The pop is focus-gated on the
# sheet's own dismissal (the sheet closes itself with router.back() on
# success; an unguarded pop from underneath raced it), so wait for the
# origin to be back first: the pop is the step that takes time, and the two
# trees can briefly coexist mid-transition. Only then assert the session
# screen is gone. No `back` step: there is nothing left to go back from, and
# Back on the root tab would background the app before the Board taps.
- extendedWaitUntil:
    visible:
      id: "triage-home-list"
    timeout: 15000
- assertNotVisible:
    id: "session-screen"
# And the board agrees: the card sits in the To Do column now.
- tapOn:
    text: "Board"
- tapOn:
    id: "board-column-chip-lane-todo"
- extendedWaitUntil:
    visible:
      id: "board-card-stub-task-1"
    timeout: 20000
