appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# The stub raises a permission prompt ~20s in. A prompt-pending session is
# a normal Idle row (uniform inbox styling, no inline approve/deny);
# tapping it opens the session in chat mode where the real permission card
# answers the prompt.
- launchApp
# The Agents feed's section collapse is PERSISTED, so it survives launchApp
# and leaks between flows (see chat-fallback-reading-view for the mechanism).
# Wait for the header first, then expand only if the row is still missing.
- extendedWaitUntil:
    visible:
      id: "section-header-idle"
    timeout: 60000
- runFlow:
    when:
      notVisible:
        id: "activity-row-stub-session-1"
    commands:
      - tapOn:
          id: "section-header-idle"
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 60000
# The stub raises its prompt ~20s after the stream subscribes; wait for the
# row's prompt teaser so the no-inline-approve assertion below is checked
# while a prompt is actually pending (not vacuously before it exists).
- extendedWaitUntil:
    visible:
      text: "Approve:.*"
    timeout: 60000
# No inline controls on Home: the approve button must NOT be on this screen.
- assertNotVisible:
    id: "permission-approve"
- tapOn:
    id: "activity-row-stub-session-1"
# Lands in the session with the chat lens active and the prompt card showing.
- extendedWaitUntil:
    visible:
      id: "permission-approve"
    timeout: 30000
- tapOn:
    id: "permission-approve"
- extendedWaitUntil:
    notVisible:
      id: "permission-approve"
    timeout: 15000
# Back on Home the needs-you card has cleared into a working/idle row.
- tapOn:
    id: "task-back-button"
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 15000
