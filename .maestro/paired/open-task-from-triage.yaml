appId: com.kangentic.mobile
---
# Precondition: the app is PAIRED to a running scripts/stubDesktopPeer.mjs
# (over a local kangentic-relay) and the stub's ongoing session is up.
# Pair once manually: node scripts/stubDesktopPeer.mjs --relay ws://<host>:8080,
# paste the printed URI into the pairing screen, confirm the SAS both sides.
- launchApp
# 60s: cold boot + channel re-establish after launchApp's force-stop.
- extendedWaitUntil:
    visible:
      id: "triage-home-list"
    timeout: 60000
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 20000
- tapOn:
    id: "activity-row-stub-session-1"
- extendedWaitUntil:
    visible:
      id: "session-screen"
    timeout: 20000
# Terminal is the default lens; switch to Chat for the transcript.
- tapOn:
    id: "session-mode-chat"
- extendedWaitUntil:
    visible:
      id: "conversation-list"
    timeout: 15000
- assertVisible: "Fix the login redirect bug and add a regression test."
# Changes is a same-screen mode behind the pill bar (TaskHeader's
# onOpenChanges chip / the old pushed ChangesScreen are unused now that
# SessionScreen renders ChangesTab inline for session-mode-changes).
- tapOn:
    id: "session-mode-changes"
- assertVisible:
    id: "changes-scope"
- extendedWaitUntil:
    visible:
      id: "changes-file-list"
    timeout: 15000
- assertVisible: "src/auth/login.ts"
