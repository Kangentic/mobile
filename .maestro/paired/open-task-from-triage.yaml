appId: com.kangentic.mobile
---
# Precondition: the app is PAIRED to a running scripts/stubDesktopPeer.mjs
# (over a local kangentic-relay) and the stub's ongoing session is up.
# Pair once manually: node scripts/stubDesktopPeer.mjs --relay ws://<host>:8080,
# paste the printed URI into the pairing screen, confirm the SAS both sides.
- launchApp
# 60s: cold boot + channel re-establish after launchApp's force-stop.
- extendedWaitUntil:
    visible:
      id: "triage-home-list"
    timeout: 60000
# The Agents feed's section collapse is PERSISTED, so it survives launchApp
# and leaks between flows (see chat-fallback-reading-view for the mechanism).
# Wait for the header first, then expand only if the row is still missing.
- extendedWaitUntil:
    visible:
      id: "section-header-idle"
    timeout: 60000
- runFlow:
    when:
      notVisible:
        id: "activity-row-stub-session-1"
    commands:
      - tapOn:
          id: "section-header-idle"
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 20000
- tapOn:
    id: "activity-row-stub-session-1"
- extendedWaitUntil:
    visible:
      id: "session-screen"
    # 45s: this screen mounts all three panes at once, terminal WebView
    # included. 20s held only on a warm emulator.
    timeout: 45000
# Terminal is the default lens; switch to Chat for the transcript.
- tapOn:
    id: "session-mode-chat"
- extendedWaitUntil:
    visible:
      id: "conversation-list"
    timeout: 15000
# Assert on the NEWEST turn, not the opening user message.
#
# The chat lens now opens pinned to the bottom with no visible reflow, so the
# first message of the transcript is legitimately scrolled off - this used to
# pass only because the list was still mid-reflow when the assertion ran,
# which is the flashing the pin was added to remove. Scroll up to prove
# history is reachable, then come back.
- assertVisible: "npm run test:unit -- auth-redirect"
- scrollUntilVisible:
    element:
      text: "Fix the login redirect bug and add a regression test."
    direction: UP
    timeout: 20000
# Changes is a same-screen mode behind the pill bar (TaskHeader's
# onOpenChanges chip / the old pushed ChangesScreen are unused now that
# SessionScreen renders ChangesTab inline for session-mode-changes).
- tapOn:
    id: "session-mode-changes"
- assertVisible:
    id: "changes-scope"
- extendedWaitUntil:
    visible:
      id: "changes-file-list"
    timeout: 15000
- assertVisible: "src/auth/login.ts"
