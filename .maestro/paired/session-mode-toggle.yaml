appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# The Session view opens on the TERMINAL lens (quick keys + dictation mic;
# typing happens directly in the terminal, no staging field); the mode pill
# flips to CHAT (message composer), then CHANGES (diff pane), and back.
# WebView content is never asserted - only RN-side testIDs.
- launchApp
# 60s: cold boot + channel re-establish after launchApp's force-stop.
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 60000
- tapOn:
    id: "activity-row-stub-session-1"
- assertVisible:
    id: "session-screen"
- extendedWaitUntil:
    visible:
      id: "quick-key-esc"
    timeout: 15000
- tapOn:
    id: "session-mode-chat"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 10000
- assertNotVisible:
    id: "quick-key-esc"
- tapOn:
    id: "session-mode-changes"
- extendedWaitUntil:
    visible:
      id: "changes-scope"
    timeout: 10000
- assertNotVisible:
    id: "composer-input"
- tapOn:
    id: "session-mode-terminal"
- extendedWaitUntil:
    visible:
      id: "quick-key-esc"
    timeout: 10000
