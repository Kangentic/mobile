appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# Self-contained delete: create a throwaway card, then delete it through the
# two-step confirm and assert it leaves the board.
- launchApp
# 60s: the dev client cold-boots the bundle after launchApp's force-stop;
# wait for the tab bar instead of tapping into a still-booting app.
- extendedWaitUntil:
    visible:
      text: "Board"
    timeout: 60000
- tapOn:
    text: "Board"
# stub-task-2 is the board-loaded anchor: it lives in To Do, the pager's
# default page (stub-task-1 is in Doing and would need a column switch).
- extendedWaitUntil:
    visible:
      id: "board-card-stub-task-2"
    timeout: 20000
- tapOn:
    id: "board-create-task"
- tapOn:
    id: "create-task-title"
- inputText: "Delete me Maestro"
- tapOn:
    id: "create-task-column-To Do"
- tapOn:
    id: "create-task-confirm"
- extendedWaitUntil:
    visible: "Delete me Maestro"
    timeout: 15000
- longPressOn: "Delete me Maestro"
- assertVisible:
    id: "task-actions-sheet"
- tapOn:
    id: "task-action-delete"
# Assert the row actually ARMED before confirming. The delete row swaps its
# own testID when armed, so without this the flow cannot tell "armed" from
# "the tap landed during the sheet's presentation animation and did nothing" -
# the second tap then arms it instead of confirming, the window relaxes, and
# the failure surfaces two steps later as a card that would not delete.
- extendedWaitUntil:
    visible:
      id: "task-action-delete-confirm"
    timeout: 10000
- tapOn:
    id: "task-action-delete-confirm"
- extendedWaitUntil:
    notVisible: "Delete me Maestro"
    timeout: 15000
