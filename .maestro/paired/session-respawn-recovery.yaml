appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# /respawn makes the stub end the current session, sit sessionless for a real
# gap (STUB_RESPAWN_GAP_MS), then swap the task to a fresh sessionId - the
# same suspend-then-respawn shape a real desktop-driven model/agent/effort
# change produces. During the gap the screen must show the silent swap veil
# and NEITHER text overlay (the gap sits inside SESSION_SWAP_QUIET_MS, pinned
# by tests/unit/sessionRespawnGapTiming.test.ts); once the successor lands,
# its transcript marker appears and the veil clears.
- launchApp
# 60s: cold boot + channel re-establish after launchApp's force-stop.
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 60000
- tapOn:
    id: "activity-row-stub-session-1"
- extendedWaitUntil:
    visible:
      id: "session-screen"
    # 45s: this screen mounts all three panes at once, terminal WebView
    # included. 20s held only on a warm emulator.
    timeout: 45000
- tapOn:
    id: "session-mode-chat"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 10000
- tapOn:
    id: "composer-input"
- inputText: "/respawn"
- tapOn:
    id: "composer-send"
# The gap: the task is sessionless while the stub holds STUB_RESPAWN_GAP_MS
# before installing the successor. The veil carries no text at all, so this
# is by testID out of necessity as well as policy. The two text overlays are
# asserted ABSENT: a swap this short must never reveal either.
#
# TRIAGE NOTE: this is the one assertion here on a TRANSIENT state, visible
# for the stub's 6s gap plus the successor's bind-to-paint round trip. A
# starved emulator can poll first after the successor has already painted,
# which burns the full timeout and reports "never visible" - indistinguishable
# from the real regression. Check process state and emulator load BEFORE
# reading a failure here as a product bug (the same trap the google_apis
# image set off in the developer guide), and never just raise the timeout: a
# longer wait cannot see a state that has passed.
- extendedWaitUntil:
    visible:
      id: "session-swap-veil"
    timeout: 10000
- assertNotVisible:
    id: "session-switching-state"
- assertNotVisible:
    id: "session-ended-state"
# Anchored regex: the markdown renderer can split the marker across text
# nodes, and Maestro's text matcher is full-string - match the stable head.
- extendedWaitUntil:
    visible: "Respawned session online.*"
    timeout: 25000
- assertNotVisible:
    id: "session-ended-state"
# In chat mode the window settles on the successor's transcript window, which
# is what just rendered the marker above - so the veil has let go by now.
- assertNotVisible:
    id: "session-swap-veil"
# Back to the lens this flow is actually named for. Everything above runs in
# CHAT, so for the whole life of the black-terminal bug (the pane lost its feed
# subscription on every session swap, src/state/terminalFeed.ts) this flow
# passed green.
#
# WHAT THIS CAN AND CANNOT PROVE. xterm paints to a WebGL canvas, so the
# rendered frame is not in the accessibility hierarchy and NO Maestro
# assertion can see whether the terminal is black. What it does catch is the
# pane being torn down, crashing, or being buried under an overlay after the
# swap - the tap below would fail on the last of those, which is the only way
# a stacking fault ever surfaces.
#
# The frame itself is guarded one tier down, in
# tests/components/SessionScreen.terminal-swap.test.tsx, which mounts the real
# TerminalPane and asserts what reaches the WebView bridge across a swap. Do
# not "strengthen" this flow by asserting terminal text; it cannot work.
- tapOn:
    id: "session-mode-terminal"
- extendedWaitUntil:
    visible:
      id: "terminal-webview"
    timeout: 15000
- assertNotVisible:
    id: "session-ended-state"
# The successor's marker text is already visible above, which means it has
# bound and the quiet window has closed - so by this point in the flow every
# swap surface should be gone, not merely never-opened. The text one never
# opened at all (asserted in the gap); the veil opened and let go.
- assertNotVisible:
    id: "session-switching-state"
- assertNotVisible:
    id: "session-swap-veil"
