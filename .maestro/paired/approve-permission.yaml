appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# The stub raises a permission prompt ~20s after the stream subscribes; this
# flow waits for it, approves it from the CHAT lens, and asserts the card
# resolves. The stub's console logs the received keystrokes.
- launchApp
# 60s: launchApp force-stops, so the dev client cold-boots the bundle and
# the channel re-establishes before the first row can render.
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 60000
- tapOn:
    id: "activity-row-stub-session-1"
# 45s, matching the prompt wait below rather than the 20s this used to be.
# The session screen mounts all three panes at once - terminal WebView
# included - and on the first launch after an install, with ART still
# compiling, that reliably outruns 20s. It passed on every warm run and
# failed on every cold one, which is the signature of a timeout that is too
# tight rather than a screen that is broken.
- extendedWaitUntil:
    visible:
      id: "session-screen"
    timeout: 45000
# The prompt card lives in the chat lens (terminal is the default).
- tapOn:
    id: "session-mode-chat"
- extendedWaitUntil:
    visible:
      id: "permission-approve"
    timeout: 45000
- tapOn:
    id: "permission-approve"
- extendedWaitUntil:
    notVisible:
      id: "permission-approve"
    timeout: 15000
