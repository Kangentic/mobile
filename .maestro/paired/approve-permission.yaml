appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# The stub raises a permission prompt ~20s after the stream subscribes; this
# flow waits for it, approves it from the CHAT lens, and asserts the card
# resolves. The stub's console logs the received keystrokes.
- launchApp
# 60s: launchApp force-stops, so the dev client cold-boots the bundle and
# the channel re-establishes before the first row can render.
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 60000
- tapOn:
    id: "activity-row-stub-session-1"
- extendedWaitUntil:
    visible:
      id: "session-screen"
    timeout: 20000
# The prompt card lives in the chat lens (terminal is the default).
- tapOn:
    id: "session-mode-chat"
- extendedWaitUntil:
    visible:
      id: "permission-approve"
    timeout: 45000
- tapOn:
    id: "permission-approve"
- extendedWaitUntil:
    notVisible:
      id: "permission-approve"
    timeout: 15000
