appId: com.kangentic.mobile
---
# Precondition: paired to scripts/stubDesktopPeer.mjs (see open-task-from-triage.yaml).
# The FAB create flow against the stub's stateful board: the created card
# appears in the To Do column after the board push.
- launchApp
# 60s: the dev client cold-boots the bundle after launchApp's force-stop;
# wait for the tab bar instead of tapping into a still-booting app.
- extendedWaitUntil:
    visible:
      text: "Board"
    timeout: 60000
- tapOn:
    text: "Board"
# stub-task-2 is the board-loaded anchor: it lives in To Do, the pager's
# default page (stub-task-1 is in Doing and would need a column switch).
- extendedWaitUntil:
    visible:
      id: "board-card-stub-task-2"
    timeout: 20000
- tapOn:
    id: "board-create-task"
- assertVisible:
    id: "create-task-sheet"
- tapOn:
    id: "create-task-title"
- inputText: "Created from Maestro"
- tapOn:
    id: "create-task-column-To Do"
- tapOn:
    id: "create-task-confirm"
- extendedWaitUntil:
    notVisible:
      id: "create-task-sheet"
    timeout: 10000
- extendedWaitUntil:
    visible: "Created from Maestro"
    timeout: 15000
