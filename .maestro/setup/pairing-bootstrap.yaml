appId: com.kangentic.mobile
tags:
  - setup
---
# Rig-driven pairing bootstrap, NOT a test: pairs a freshly-cleared app
# instance to a stub peer whose pairing URI arrives via the PAIRING_URI env
# var (the stub auto-confirms its SAS side with --yes; this flow accepts the
# phone side). Used by the sharded local rig (each extra emulator instance
# must pair to its own stub) and the future CI Maestro job. Exclude it from
# suite runs with --exclude-tags setup.
# Deliberately NOT `launchApp: clearState: true`, which is the form the docs
# otherwise recommend. Against a DEV CLIENT, clearing state also wipes the
# saved Metro bundle URL, so the app comes up on the dev launcher ("start a
# development server") and no JS ever loads. The caller has to clear state and
# then re-point the dev client at Metro BEFORE this flow starts (dev.mjs's
# pointDevClientAtMetro does exactly that), which a clearState inside the
# launch would undo.
- launchApp
# The dev client's one-time first-run sheet has to go FIRST. It is a separate
# window covering the full screen, so while it is up the app's entire view
# tree is absent from the hierarchy - not merely occluded - and no testID of
# ours can be found, however visible the screen looks. This flow always runs
# against a freshly-cleared install (see the header), so the sheet is always
# there; waiting on it doubles as the cold-boot gate.
#
# "Continue" is expo-dev-client's own string, not our UI copy. Everything of
# OURS below is addressed by testID: the pair CTA's label already changed once
# ("Pair with your desktop" -> "Pair") and silently broke this flow.
# The dev client opens a one-time first-run sheet that covers the WHOLE
# screen: while it is up the app's view tree is absent from the hierarchy, so
# no testID of ours resolves however visible the screen looks. Its "Continue"
# only dismisses the explainer and expands the dev menu proper, which then has
# to be closed. An `e2e` build has no dev menu at all, so both steps are
# conditional and the flow runs unchanged against either binary.
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
      - tapOn: "Close"
- extendedWaitUntil:
    visible:
      id: "triage-pair-cta"
    timeout: 90000
- tapOn:
    id: "triage-pair-cta"
- extendedWaitUntil:
    visible:
      id: "pairing-paste-link-input"
    timeout: 15000
- tapOn:
    id: "pairing-paste-link-input"
- inputText: ${PAIRING_URI}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "pairing-paste-link-submit"
    timeout: 5000
- tapOn:
    id: "pairing-paste-link-submit"
- extendedWaitUntil:
    visible:
      id: "sas-accept"
    timeout: 30000
- tapOn:
    id: "sas-accept"
# Full-pipeline proof: the stub's session row lands on the Agents feed.
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 60000
