appId: com.kangentic.mobile
tags:
  - setup
---
# Rig-driven pairing bootstrap, NOT a test: pairs a freshly-cleared app
# instance to a stub peer whose pairing URI arrives via the PAIRING_URI env
# var (the stub auto-confirms its SAS side with --yes; this flow accepts the
# phone side). Used by the sharded local rig (each extra emulator instance
# must pair to its own stub) and the future CI Maestro job. Exclude it from
# suite runs with --exclude-tags setup.
- launchApp
# Wait out the cold boot first: checking for the dev client's one-time
# first-run sheet ("Continue") immediately after launchApp races the boot and
# skips before the sheet exists. Waiting on the pair CTA gives the app time
# to mount either way, then the sheet is dismissed if it is on top.
#
# The CTA is matched by testID, never by its label: the label is UI copy and
# has already changed once ("Pair with your desktop" -> "Pair"), which is
# exactly what a text selector cannot survive.
- extendedWaitUntil:
    visible:
      id: "triage-pair-cta"
    timeout: 90000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- tapOn:
    id: "triage-pair-cta"
- extendedWaitUntil:
    visible:
      id: "pairing-paste-link-input"
    timeout: 15000
- tapOn:
    id: "pairing-paste-link-input"
- inputText: ${PAIRING_URI}
- hideKeyboard
- extendedWaitUntil:
    visible:
      id: "pairing-paste-link-submit"
    timeout: 5000
- tapOn:
    id: "pairing-paste-link-submit"
- extendedWaitUntil:
    visible:
      id: "sas-accept"
    timeout: 30000
- tapOn:
    id: "sas-accept"
# Full-pipeline proof: the stub's session row lands on the Agents feed.
- extendedWaitUntil:
    visible:
      id: "activity-row-stub-session-1"
    timeout: 60000
